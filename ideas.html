  out+=section(T("🍬 Little extras","🍬 Detallitos para acompañar"),T("Under $15, to tuck in with the gift.","Menos de $15, para acompañar el regalo."),take(STUFF,PAL.stuff,"",4,{max:15}));
  if(X.gc.includes(0)||X.gc.includes(1)) out+=`<p class="foot" style="margin-top:22px">💳 ${esc(X.gc.includes(0)?T(`${fn} said gift cards are welcome.`,`${fn} dijo que las tarjetas de regalo son bienvenidas.`):T(`${fn} likes gift cards for a store they love.`,`A ${fn} le gustan las tarjetas de regalo de una tienda que le guste.`))}</p>`;
  app.innerHTML=out+foot(); wire(); }

  const ag=document.getElementById("askGo"); if(ag) ag.onclick=askGo; document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ L=b.dataset.l; try{ localStorage.setItem("posada-lang",L); }catch(e){} render(); });
  document.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{ BUD=+b.dataset.b; const y=scrollY; render(); scrollTo(0,y); }); }
