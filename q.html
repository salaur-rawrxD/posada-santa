<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap">
<style>
:root{--night:#16224a;--night2:#22336b;--card:#fff8ec;--ink:#2a1d14;--muted:#7a6553;--red:#d7372f;--gold:#f5c66a;--cream:#fff8ec;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;--body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(110% 70% at 50% 0%,#4a2470,#22336b 55%,var(--night) 85%) fixed,var(--night);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.picado{display:flex;justify-content:center;gap:6px;height:44px;overflow:hidden;position:relative}
.picado::before{content:"";position:absolute;left:0;right:0;top:4px;height:2px;background:#2e5a3e}
.picado i{flex:0 0 28px;height:38px;margin-top:4px;clip-path:polygon(0 0,100% 0,100% 82%,88% 100%,75% 82%,62% 100%,50% 82%,38% 100%,25% 82%,12% 100%,0 82%)}
.wrap{max-width:560px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) 50px max(16px,env(safe-area-inset-right));display:grid;gap:16px}
.lang{justify-self:end;display:inline-flex;padding:3px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.lang button{font:inherit;font-weight:800;font-size:12.5px;border:0;background:none;color:#c3cbe8;padding:6px 11px;border-radius:99px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#f5a524;color:#1c1430}
.card{background:var(--card);color:var(--ink);border-radius:26px;padding:26px 22px 22px;display:grid;gap:14px;box-shadow:0 22px 50px rgba(0,0,0,.35);text-align:center;position:relative}
.big-e{font-size:56px;line-height:1;margin-top:-4px}
.kick{font-size:11.5px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(28px,8vw,38px);line-height:1.05;color:var(--red)}
.q{font-family:var(--display);font-weight:400;font-size:clamp(24px,7vw,32px);line-height:1.15;color:#3b2470;background:#f3ecff;border-radius:18px;padding:18px 16px;border:2px dashed #b9a2ec;overflow-wrap:anywhere}
p{margin:0;font-weight:700;color:#5b4a3c}
textarea{font:inherit;font-weight:700;font-size:16px;width:100%;border-radius:14px;border:1.5px solid #e0d2bd;background:#fff;color:var(--ink);padding:12px 14px;min-height:96px;resize:vertical;text-align:left}
.btn{font:inherit;font-weight:900;font-size:17px;min-height:54px;border:0;border-radius:16px;cursor:pointer;color:#1c1430;background:linear-gradient(180deg,#ffd77a,#f5a524);box-shadow:0 4px 0 #b8741a;text-decoration:none;display:flex;align-items:center;justify-content:center;padding:0 18px}
.btn:disabled{opacity:.6}
.ans{background:#eaf7e8;border:1.5px solid #9fd398;border-radius:16px;padding:12px 14px;font-weight:800;text-align:left;color:#1f4d1a}
.fine{font-size:12.5px;color:#9aa6cf;text-align:center;font-weight:700}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
</style>
</head>
<body>
<div class="picado" aria-hidden="true" id="picado"></div>
<main class="wrap"><div class="lang" role="group" aria-label="Language / Idioma"><button data-l="en">EN</button><button data-l="es">ES</button></div><div id="app"></div>
<p class="fine">🤫 Posada Santa · <a href="/" style="color:inherit">posadaxmas.com</a></p></main>
<script>
const SB_URL="https://ktssnlyspwzhdhffpgqm.supabase.co", SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0c3NubHlzcHd6aGRoZmZwZ3FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5MjYwMDgsImV4cCI6MjEwOTUwMjAwOH0.3lHaJYRYCyeqcdgS2EIfT1_6qr0B5CxNqYQNHkyevCk";
async function rpc(fn,args){ const c=new AbortController(), tm=setTimeout(()=>c.abort(),9000);
  try{ const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY,Authorization:"Bearer "+SB_KEY},body:JSON.stringify(args),signal:c.signal});
    if(!r.ok) throw new Error("rpc "+r.status); return await r.json(); } finally{ clearTimeout(tm); } }
const ORIGIN=location.origin;
const MINE={K:"posada-groups-v1", load(){ try{ const d=JSON.parse(localStorage.getItem(this.K)||"null"); if(d&&d.groups) return d; }catch(e){} return {groups:{},cur:null}; },
  join(gid,gn,me,extra){ if(!gid) return; const d=this.load(), g=d.groups[gid]||(d.groups[gid]={gn:gn||"",e:{}}); if(gn) g.gn=gn; if(me) g.me=String(me).trim().slice(0,18); Object.assign(g,extra||{}); g.seen=Date.now(); d.cur=gid; try{ localStorage.setItem(this.K,JSON.stringify(d)); }catch(e){} } };
const QLINK_URL="https://buy.stripe.com/5kQ4gs0dLa505JNdA9ejK02";

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let L=(()=>{ try{ const s=localStorage.getItem("posada-lang"); if(s==="en"||s==="es") return s; }catch(e){} return (navigator.language||"").startsWith("en")?"en":"es"; })();
const T=(en,es)=>L==="es"?es:en;
const nick=s=>{ const w=String(s||"").trim().split(/\s+/); return w.slice(0,/^(t[ií][ao]|abuel[ao]|abuelit[ao]|prim[ao]|mam[aá]|pap[aá]|don|doña|nin[ao]|padrino|madrina|aunt|uncle|grandma|grandpa|cousin)$/i.test(w[0]||"")?2:1).join(" "); };
const m=location.hash.match(/a=([0-9a-f-]{36})\.([0-9a-f]{20,})/), A=m?{id:m[1],r:m[2]}:null;
const PAID=/[?&]paid=1/.test(location.search);
let S=null, state="load", sent=false;
const app=document.getElementById("app");
function render(){ document.documentElement.lang=L; document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===L)));
  if(A){ // the match answers
    if(state==="load"){ app.innerHTML=`<div class="card"><div class="big-e">🤫</div><p class="dots">${esc(T("Opening your secret question","Abriendo tu pregunta secreta"))}</p></div>`; return; }
    if(!S){ app.innerHTML=`<div class="card"><div class="big-e">🎁</div><h1>${esc(T("This link expired","Este link ya no sirve"))}</h1><p>${esc(T("Ask your organizer to send you the question again.","Pídele a tu organizador(a) que te mande la pregunta otra vez."))}</p></div>`; return; }
    const fn=nick(S.to);
    if(S.answered&&!sent&&state!=="edit"){ app.innerHTML=`<div class="card"><div class="kick">${esc(T("Your Secret Santa asked","Tu Santa Secreto preguntó"))}</div><div class="q">${esc(S.question)}</div><div class="ans">✓ ${esc(S.answer)}</div><p>${esc(T("Your Santa can already see your answer.","Tu Santa ya puede ver tu respuesta."))}</p><button class="btn" id="edit" style="background:#f1e6d2;box-shadow:none">✏️ ${esc(T("Change my answer","Cambiar mi respuesta"))}</button></div>`; return; }
    if(sent){ app.innerHTML=`<div class="card"><div class="big-e">🎉</div><h1>${esc(T("Sent to your Santa!","¡Listo, se lo mandamos!"))}</h1><p>${esc(T("Your Secret Santa can see your answer now. Act surprised at the posada 😉","Tu Santa Secreto ya puede ver tu respuesta. Hazte el sorprendido en la posada 😉"))}</p><a class="btn" href="/juegos">🎮 ${esc(T("Play the posada games","Juega los juegos de la posada"))}</a></div>`; return; }
    app.innerHTML=`<div class="card"><div class="big-e">🤫</div><div class="kick">${esc(T(`${fn}, your Secret Santa asks`,`${fn}, tu Santa Secreto pregunta`))}</div><div class="q">${esc(S.question)}</div>
      <p>${esc(T("Answer here. They'll see it, but you'll never know who asked, and nobody else will either.","Contesta aquí. Tu Santa lo verá, pero tú no sabrás quién preguntó, y nadie más tampoco."))}</p>
      <textarea id="ans" maxlength="400" placeholder="${esc(T("Your answer…","Tu respuesta…"))}">${esc(state==="edit"?S.answer||"":"")}</textarea>
      <button class="btn" id="send">🤫 ${esc(T("Send my answer","Mandar mi respuesta"))}</button></div>`; return; }
  if(PAID){ let pend=null; try{ pend=localStorage.getItem("posada-q-pending"); }catch(e){}
    const q=(()=>{ try{ return JSON.parse(localStorage.getItem("posada-q")||"[]").find(x=>x.id===pend); }catch(e){ return null; } })();
    const back=q?`<a class="btn" href="/ideas#${esc(q.code)}">🎁 ${esc(T("Back to gift ideas","Volver a las ideas de regalo"))}</a>`:"";
    app.innerHTML=`<div class="card"><div class="big-e">${S&&S.paid?"📮":"⏳"}</div><h1>${esc(S&&S.paid?T("Your question is on its way!","¡Tu pregunta va en camino!"):T("Confirming your payment","Confirmando tu pago"))}</h1>
      ${q?`<div class="q">${esc(q.q)}</div>`:""}<p class="${S&&S.paid?"":"dots"}">${esc(S&&S.paid?T(`Your organizer will pass it to ${nick(q&&q.to)} without seeing it or knowing who asked. Their answer will show up on your gift ideas page.`,`Tu organizador(a) se la va a mandar a ${nick(q&&q.to)} sin verla ni saber quién preguntó. Su respuesta va a salir en tu página de ideas de regalo.`):T("This takes a few seconds","Esto tarda unos segundos"))}</p>${back}</div>`; return; }
  app.innerHTML=`<div class="card"><div class="big-e">🎁</div><h1>Posada Santa</h1><p>${esc(T("Nothing to see here. Open the link from your text message.","No hay nada aquí. Abre el link que te mandaron por mensaje."))}</p><a class="btn" href="/">posadaxmas.com</a></div>`; }
function wire(){ const sb=document.getElementById("send"); if(sb) sb.onclick=async()=>{ const v=document.getElementById("ans").value.trim(); if(!v){ document.getElementById("ans").focus(); return; } sb.disabled=true;
    try{ const ok=await rpc("answer_question",{p_id:A.id,p_rtok:A.r,p_answer:v}); if(ok===true){ sent=true; S.answered=true; S.answer=v; render(); wire(); return; } }catch(e){}
    sb.disabled=false; alert(T("Couldn't send it. Check your connection and try again.","No se pudo mandar. Revisa tu conexión e intenta otra vez.")); };
  const ed=document.getElementById("edit"); if(ed) ed.onclick=()=>{ state="edit"; render(); wire(); }; }
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ L=b.dataset.l; try{ localStorage.setItem("posada-lang",L); }catch(e){} render(); wire(); });
document.getElementById("picado").innerHTML=Array.from({length:30},(_,i)=>`<i style="background:${["#ff4fa3","#ffd34d","#2fb3a3","#ff7a2f","#7a5cff","#53b84a","#ef3b3b"][i%7]}"></i>`).join("");
(async()=>{ render();
  if(A){ try{ S=await rpc("question_for_match",{p_id:A.id,p_rtok:A.r}); if(S&&S.lang&&!localStorage.getItem("posada-lang")) L=S.lang; }catch(e){ S=null; } state="ready"; render(); wire(); return; }
  if(PAID){ let pend=null, q=null; try{ pend=localStorage.getItem("posada-q-pending"); q=JSON.parse(localStorage.getItem("posada-q")||"[]").find(x=>x.id===pend); }catch(e){}
    if(!q){ render(); return; } for(let i=0;i<30;i++){ try{ S=await rpc("question_status",{p_id:q.id,p_tok:q.tok}); }catch(e){} render(); if(S&&S.paid){ try{ localStorage.removeItem("posada-q-pending"); }catch(e){} return; } await new Promise(r=>setTimeout(r,3000)); } } })();
</script>
</body>
</html>
