function decode(code){ if(!/^x[0-9a-f]+$/.test(code)||code.length%2!==1) return null; const hex=code.slice(1), b=new Uint8Array(hex.length/2);
  for(let i=0;i<b.length;i++) b[i]=parseInt(hex.substr(i*2,2),16)^KEY.charCodeAt(i%KEY.length); try{ return JSON.parse(new TextDecoder().decode(b)); }catch(e){ return null; } }
// Mailbox access: from the person's own piñata code (#x…) or from the email alert link (#g=…&m=…)

  const c=(h.toLowerCase().match(/x[0-9a-f]{40,}/)||[])[0]; if(c){ const cc=c.length%2===1?c:c.slice(0,-1), d=decode(cc); if(d&&d.gid&&d.mb) return {gid:d.gid,mb:d.mb,code:cc,l:d.l}; }

    const fn=nick(BOX.name), qs=BOX.questions||[], open=qs.filter(q=>!q.answered||editing[q.id]);

  if(PAID){ let pend=null; try{ pend=localStorage.getItem("posada-q-pending"); }catch(e){}

    app.innerHTML=`<div class="card"><div class="big-e">${S&&S.paid?"📬":"⏳"}</div><h1>${esc(S&&S.paid?T("It's in their mailbox!","¡Ya está en su buzón!"):T("Confirming your payment","Confirmando tu pago"))}</h1>
