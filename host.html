/* ---------- sealed codes ---------- */
function seal(o,pre){ const b=new TextEncoder().encode(JSON.stringify(o)); let s=""; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]^KEY.charCodeAt(i%KEY.length)); return pre+btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unseal(c,pre){ try{ if(!c||c[0]!==pre) return null; let s=c.slice(1).replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; const bin=atob(s), b=new Uint8Array(bin.length); for(let i=0;i<b.length;i++) b[i]=bin.charCodeAt(i)^KEY.charCodeAt(i%KEY.length); return JSON.parse(new TextDecoder().decode(b)); }catch(e){ return null; } }
// piñata codes use the reveal page's hex format
function pinCode(obj){ const b=new TextEncoder().encode(JSON.stringify(obj)); let h="x"; for(let i=0;i<b.length;i++) h+=(b[i]^KEY.charCodeAt(i%KEY.length)).toString(16).padStart(2,"0"); return h; }
function pinDecode(code){ try{ const hex=code.slice(1), b=new Uint8Array(hex.length/2); for(let i=0;i<b.length;i++) b[i]=parseInt(hex.substr(i*2,2),16)^KEY.charCodeAt(i%KEY.length); return JSON.parse(new TextDecoder().decode(b)); }catch(e){ return null; } }

/* ---------- storage ---------- */
let canSave=true;
function loadDB(){ try{ const v=JSON.parse(localStorage.getItem(SKEY)||"null"); if(v&&v.groups) return v; }catch(e){ canSave=false; } return {v:1,cur:null,ui:null,groups:{}}; }
let DB=loadDB();
function persist(){ const g=DB.groups&&DB.groups[DB.cur]; if(g) g.ut=Date.now(); try{ localStorage.setItem(SKEY,JSON.stringify(DB)); canSave=true; }catch(e){ canSave=false; } if(typeof AUTH!=="undefined") AUTH.queue(); }
const G=()=>DB.groups[DB.cur]||null;
const P=id=>G().people.find(p=>p.id===id);

/* ---------- the family game leaderboard (travels inside links, no server) ---------- */
function boardRows(g){ g=g||G(); return Object.values(g.board||{}).filter(r=>r.s>0).sort((a,b)=>b.s-a.s||a.n.localeCompare(b.n)); }
function boardEntries(g){ return boardRows(g).slice(0,20).map(r=>[r.n,r.s,r.st||0,r.lv||0,r.t||0]); }
function boardCode(g){ g=g||G(); return seal({gid:g.gid,gn:g.name,e:boardEntries(g)},"S"); }
function mergeBoard(g,entries){ g.board=g.board||{}; let ch=0; (entries||[]).forEach(([n,sc,st,lv,ts])=>{ const k=norm(n); if(!k) return; const o=g.board[k]; if(!o||sc>o.s){ g.board[k]={n,s:+sc||0,st:+st||0,lv:+lv||0,t:+ts||0}; ch++; } }); return ch; }
function findBoards(text){ const out=[]; (String(text||"").match(/sb=(S[A-Za-z0-9_-]{8,})/g)||[]).forEach(m=>{ const o=unseal(m.slice(3),"S"); if(o&&o.gid) out.push(o); }); return out; }
function importBoards(list){ let n=0; list.forEach(o=>{ const g=DB.groups[o.gid]; if(g) n+=mergeBoard(g,o.e)||0.0001; }); if(n){ persist(); render(); toast(t("lbUpdated")); } return n>0; }
function importAny(text){ const a=importLetters(findLetters(text)), b=importBoards(findBoards(text)); return a||b; }
const GAME_SHARE=g=>`${GAME_URL}#sb=${boardCode(g)}&me=${encodeURIComponent(g.org.name||"")}`;

/* ---------- messages ---------- */
function groupCode(g){ const o={gid:g.gid,gn:g.name,on:g.org.name,op:g.org.phone||"",b:g.budget||"",d:g.party||"",pl:g.place||"",dl:g.deadline||"",l:g.lang||"en"}; const e=boardEntries(g).slice(0,8); if(e.length) o.sb=e; return seal(o,"G"); }
function inviteURL(p){ const g=G(); return `${LETTER_URL}#g=${groupCode(g)}${p?`&n=${encodeURIComponent(p.name)}&l=${p.lang||g.lang}`:""}`; }
function lines(g,l,p){ const es=l==="es", a=[], bud=p&&p.kid&&kidsOn(g)&&g.kids.budget?g.kids.budget:g.budget;
  if(g.deadline) a.push((es?"📮 Cartas antes del ":"📮 Letters due ")+fmtDate(g.deadline,l));
  if(bud) a.push((es?"🎁 Presupuesto: ":"🎁 Gift budget: ")+bud);
  if(g.party) a.push((es?"🎄 Intercambio: ":"🎄 Gift exchange: ")+fmtDate(g.party,l)+(g.place?(es?" en ":" at ")+g.place:""));
  return a.join("\n"); }
function msgInvite(p,reminder){ const g=G(), l=p?p.lang||g.lang:g.lang, o=first(g.org.name), n=p?first(p.name):"", x=lines(g,l,p), url=inviteURL(p);
  if(l==="es") return reminder
    ? `🎄 ¡Hola ${n}! Un recordatorio de ${o}: todavía falta tu carta a Santa para ${g.name} 🎁\n\nSolo toma 3 minutos:\n${url}\n${x?"\n"+x+"\n":""}\nAl terminar, un toque me la manda. ¡Gracias! 🌟`
    : `🎄✨ ¡Feliz Navidad${n?", "+n:""}! ✨🎄\n\n${o} está organizando el Secret Santa de ${g.name} 🎁 Escribe aquí tu carta a Santa, toma unos 3 minutos:\n\n${url}\n${x?"\n"+x+"\n":""}\nAl terminar, un toque me la manda. ¡Nos vemos! 🌟`;
  return reminder
    ? `🎄 Hi ${n}! Friendly reminder from ${o}: your letter to Santa for ${g.name} is still missing 🎁\n\nIt only takes 3 minutes:\n${url}\n${x?"\n"+x+"\n":""}\nWhen you finish, one tap sends it to me. Thank you! 🌟`
    : `🎄✨ ¡Feliz Navidad${n?", "+n:""}! ✨🎄\n\n${o} is running the Secret Santa for ${g.name} 🎁 Write your letter to Santa here, it takes about 3 minutes:\n\n${url}\n${x?"\n"+x+"\n":""}\nWhen you finish, one tap sends it to me. ¡Nos vemos! 🌟`; }
function msgPinata(p,code){ const g0=G(), l=p.lang||g0.lang, n=first(p.name), kc=!!(g0.draw&&g0.draw.cards[p.id]&&g0.draw.cards[p.id].k), bud=kc&&g0.kids&&g0.kids.budget?g0.kids.budget:g0.budget,
    g=kc?Object.assign({},g0,{name:(l==="es"?W.es:W.en).kidsGroup(g0.name),budget:bud}):g0, x=[g.budget&&((l==="es"?"🎁 Presupuesto: ":"🎁 Gift budget: ")+g.budget),g.party&&((l==="es"?"🎄 Intercambio: ":"🎄 Gift exchange: ")+fmtDate(g.party,l)+(g.place?(l==="es"?" en ":" at ")+g.place:""))].filter(Boolean).join("\n");
  if(l==="es") return `🎄✨ ¡Feliz Navidad, ${n}! ✨🎄\n\n¡Ya se sortearon los nombres de ${g.name}! Tu Secret Santa está dentro de una piñata 🪅 Toca abajo y pégale hasta que se rompa 👇\n\n${REVEAL_URL}#${code}&sb=${boardCode(g0)}\n${x?"\n"+x+"\n":""}\n🤫 Shhh… este link es solo para ti. ¡No se vale espiar ni compartir! 🌟\n\n(Si la página te pide tu código, copia todo este mensaje y pégalo ahí.)`;
  return `🎄✨ ¡Feliz Navidad, ${n}! ✨🎄\n\nNames have been drawn for ${g.name}! Your Secret Santa match is inside a piñata 🪅 Tap below and keep swinging until it breaks 👇\n\n${REVEAL_URL}#${code}&sb=${boardCode(g0)}\n${x?"\n"+x+"\n":""}\n🤫 Shhh… this link is only for you. No peeking, no sharing! 🌟\n\n(If the page asks for your code, copy this whole text and paste it in.)`; }

/* ---------- groups & people ---------- */
function newGroup(){ const gid=uid(); DB.groups[gid]={gid,name:"",org:{name:"",phone:"",plays:true,id:uid()},lang:ui(),budget:"",party:"",place:"",deadline:"",people:[],pairs:[],draw:null,created:Date.now()}; DB.cur=gid; persist(); return DB.groups[gid]; }
function syncOrganizer(){ const g=G(), o=g.org; let me=g.people.find(p=>p.me);
  if(o.plays){ if(!me){ me={id:o.id,me:true,name:o.name,phone:o.phone,lang:g.lang,inv:Date.now(),letter:null}; g.people.unshift(me); } else { me.name=o.name; me.phone=o.phone; } }
  else if(me){ g.people=g.people.filter(p=>!p.me); g.pairs=g.pairs.filter(pr=>!pr.includes(me.id)); } }
function findPerson(name,phone){ const g=G(), pk=phoneKey(phone);
  if(pk.length>=7){ const m=g.people.find(p=>phoneKey(p.phone)===pk); if(m) return m; }
  const nn=norm(name); let m=g.people.find(p=>norm(p.name)===nn); if(m) return m;
  const f=norm(first(name)); const fm=g.people.filter(p=>norm(first(p.name))===f); return fm.length===1&&(!pk||!fm[0].phone)?fm[0]:null; }
function addPerson(name,phone){ name=String(name||"").trim().replace(/\s+/g," "); if(!name) return null; const g=G(); if(PLUSCFG()&&!isPlus()&&g.people.length>=PLUS_FREE_MAX){ window.__capHit=true; return null; }
  if(g.people.some(p=>norm(p.name)===norm(name)||(phoneKey(phone).length>=7&&phoneKey(p.phone)===phoneKey(phone)))) return false;
  const p={id:uid(),name,phone:String(phone||"").trim(),lang:g.lang,inv:0,letter:null}; g.people.push(p); return p; }
function parseList(text){ const out=[]; String(text||"").split(/\r?\n/).forEach(line=>{ line=line.trim().replace(/^[-•*\d.)\s]+(?=\D)/,""); if(!line) return;
    const m=line.match(/(\+?[\d][\d\s().-]{6,}\d)\s*$/); if(m){ const nm=line.slice(0,m.index).replace(/[,;:\-–—\t|]+\s*$/,"").trim(); if(nm) out.push([nm,m[1]]); return; }
    line.split(/\s*[,;]\s*/).filter(Boolean).forEach(nm=>out.push([nm,""])); }); return out; }
function addMany(list){ let a=0,d=0; list.forEach(([n,ph])=>{ const r=addPerson(n,ph); if(r) a++; else if(r===false) d++; }); persist(); toast(t("added",a)+(d?" · "+t("dupe",d):"")); return a; }
const pending=D=>Object.keys(D.cards).filter(k=>(!D.sent[k]||D.redo[k])&&!(P(k)||{}).me);
const status=p=>{ const D=G().draw; if(D&&D.cards[p.id]){ if(p.me) return ["sent",t("you")]; if(D.redo[p.id]) return ["redo",t("stRedo")]; if(D.sent[p.id]) return ["sent",t("stSent")]; return ["inv",t("stReady")]; } return p.letter?["in",t("stIn")]:p.me?["new",t("you")]:p.inv?["inv",t("stInv")]:["new",t("stNew")]; };

/* ---------- letters coming in ---------- */
function findLetters(text){ const s=String(text||""), out=[], seen=new Set();
  (s.match(/letter=(L[A-Za-z0-9_-]{20,})/g)||[]).forEach(m=>seen.add(m.slice(7)));
  (s.match(/\bL[A-Za-z0-9_-]{60,}/g)||[]).forEach(m=>seen.add(m));
  seen.forEach(c=>{ const o=unseal(c,"L"); if(o&&o.gid&&o.n) out.push(o); }); return out; }
function importLetters(list){ if(!list.length) return false; const results=[];
  list.forEach(L=>{ const g=DB.groups[L.gid]; if(!g){ results.push({other:true}); return; } DB.cur=L.gid;
    let p=findPerson(L.n,L.ph), isNew=false, had=false;
    if(p&&p.letter&&p.letter.t&&p.letter.t===L.t) return;
    if(!p){ p=addPerson(L.n,L.ph)||findPerson(L.n,L.ph); isNew=true; }
    had=!!p.letter; p.letter=L; p.la=Date.now(); p.lang=L.l||p.lang; if(L.ph&&!p.phone) p.phone=L.ph;
    if(p.me) p.lang=L.l||p.lang;
    let redo=false, late=false; const D=g.draw;
    if(D){ const giver=Object.keys(D.cards).find(k=>D.cards[k].r===p.id);
      if(giver){ D.cards[giver].code=codeFor(P(giver),p); if(D.sent[giver]){ D.redo[giver]=true; redo=true; } } else late=true; }
    results.push({p,isNew,had,redo,late}); });
  persist(); render(); if(results.length) showImport(results); return true; }
function showImport(rs){ const r=rs.find(x=>!x.other)||rs[0];
  if(r.other){ sheet(`<div class="sheethead"><div class="stack tight"><span class="kicker">📮</span><h2>${esc(t("lOther"))}</h2></div>${closeBtn()}</div><p>${esc(t("lOtherP"))}</p><button class="cta" data-act="closeSheet">${esc(t("lOk"))}</button>`); return; }
  burst(["📮","🎁","✨","⭐","🎄"]);
  const L=r.p.letter, extra=rs.filter(x=>!x.other).length-1;

function rand(n){ const u=new Uint32Array(1); crypto.getRandomValues(u); return u[0]%n; }
function blocked(a,b){ return G().pairs.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a)); }
function makeDraw(ids){ for(let tr=0;tr<40000;tr++){ const r=[...ids]; for(let i=r.length-1;i>0;i--){ const j=rand(i+1); [r[i],r[j]]=[r[j],r[i]]; }
    if(ids.every((g,i)=>g!==r[i]&&!blocked(g,r[i]))) return ids.map((g,i)=>[g,r[i]]); } return null; }
function codeFor(giver,rec){ const g=G(), L=rec.letter||{}, kid=!!(rec.kid&&kidsOn(g)), o={n:first(giver.name),l:giver.lang||g.lang,r:rec.name,s:L.s||"",p:L.p||"",h:L.h||"",g:L.g||[]}; if(L.x&&Object.keys(L.x).length) o.x=L.x;
  const b=kid&&g.kids&&g.kids.budget?g.kids.budget:g.budget; if(b) o.b=String(b).slice(0,20); if(kid) o.k=1; o.gid=g.gid; if(giver.mb) o.mb=giver.mb; return pinCode(o); }

const kidsOn=g=>!!(g&&g.kids&&g.kids.on);

function doDraw(){ const g=G(), {adults,kids}=drawSplit(), bad=drawProblem(); if(bad){ toast(bad); return; }
  const pa=makeDraw(adults.map(p=>p.id)), pk=makeDraw(kids.map(p=>p.id)), pairs=pa&&pk?[...pa,...pk]:null, kidSet=new Set(kids.map(p=>p.id)); if(!pairs){ sheet(`<div class="sheethead"><h2>🎲</h2>${closeBtn()}</div><div class="warn">${esc(t("dImpossible"))}</div><button class="cta" data-act="closeSheet">${esc(t("lOk"))}</button>`); return; }
  pairs.forEach(([a])=>{ const p=P(a); if(p&&!p.mb){ const u=new Uint8Array(16); crypto.getRandomValues(u); p.mb=[...u].map(x=>x.toString(16).padStart(2,"0")).join(""); } }); g.mbOk=false;

const NEEDACCT=new Set(["qInv","qRem","qPin","qOne","groupLink","draw","pinDirect"]);
document.addEventListener("click",e=>{ const a=e.target.closest("[data-act]"); if(!a) return; const fn=ACT[a.dataset.act]; if(!fn) return;
  if(CLOUD()&&!ME()&&NEEDACCT.has(a.dataset.act)&&G()&&G().setup){ e.preventDefault(); pendingAct={act:a.dataset.act,data:{...a.dataset}}; loginSheet("gate"); return; }
  fn(a,e); });
function wireInputs(){ const f=$("addForm"); if(f) f.onsubmit=e=>{ e.preventDefault(); const n=$("a_n"), p=$("a_p"); const r=addPerson(n.value,p.value); if(r===false) toast(t("dupe",1)); else if(r){ persist(); toast(t("added",1)); }
  n.value=""; p.value=""; if($("sheetRoot").innerHTML){ addSheet(); render(); } else { render(); } setTimeout(()=>$("a_n")&&$("a_n").focus(),50); };
  const an=$("a_n"); if(an) an.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); $("a_p").focus(); } };
  const bc=$("w_bc"); if(bc) bc.oninput=()=>{ document.querySelectorAll("[data-act=bud]").forEach(b=>b.setAttribute("aria-pressed","false")); G().budget=bc.value.trim(); persist(); }; }
addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("sheetRoot").innerHTML) closeSheet(); });

/* ---------- Posada Plus: reveal night on the TV ---------- */
/* Fiesta music for the mini games: the same Latin Christmas band as La Posada (mariachi, cumbia, son jarocho),
   with a tempo knob and a "hype" knob, plus stingers (fanfare, grito, crowd). Self-contained: FIESTA.init(getCtx, getOut). */
const FIESTA=(()=>{ let getCtx=()=>null, getOut=()=>null, BUS=null, SFX=null, NB=null, on=false, timer=null, nb=0, bt=0, RATE=1, HYPE=0;
const A=()=>{ const a=getCtx(); if(!a) return null; if(!BUS){ const o=getOut()||a.destination; BUS=a.createGain(); BUS.gain.value=.3; BUS.connect(o); SFX=a.createGain(); SFX.gain.value=.55; SFX.connect(o);
    NB=a.createBuffer(1,a.sampleRate,a.sampleRate); const d=NB.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; } return a; };
function noise(t,dur,peak,type,freq,f1,dest){ const a=A(); if(!a) return; const s=a.createBufferSource(); s.buffer=NB; const f=a.createBiquadFilter(); f.type=type||"lowpass"; f.frequency.setValueAtTime(freq||1200,t); if(f1) f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=a.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+Math.min(.02,dur*.3)); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(f).connect(g).connect(dest||BUS); s.start(t,Math.random()*.5); s.stop(t+dur+.05); }
/* =========================================================
   Latin Christmas music: three arrangements that rotate
   1) Ranchera navideña  — the original villancico, mariachi style (trumpets, guitarrón, vihuela, maracas)
   2) Cumbia del cascabel — Jingle Bells chorus (public domain) as a cumbia (accordion, güiro, bombo, bass)
   3) Son de la piñata   — an original son jarocho in 6/8 (harp, jarana, requinto, zapateado)
   ========================================================= */
const NOTEN=n=>{ const m=/^([A-G])(s|b)?(\d)$/.exec(n); if(!m) return 0; return (+m[3]+1)*12+{C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==="s"?1:m[2]==="b"?-1:0); };
const HZ=m=>440*Math.pow(2,(m-69)/12);
const CHD={C:[60,64,67],F:[60,65,69],G:[59,62,67],D:[62,66,69],A:[61,64,69],Em:[59,64,67],Bm:[59,62,66]};
const BASS={C:[36,43],F:[41,48],G:[43,38],D:[38,45],A:[45,40],Em:[40,47],Bm:[47,42]};
const bars=s=>s.trim().split("|").map(b=>b.trim().split(/\s+/));
const SONGS=[
  {id:"ranchera",beats:4,eighth:.23,style:"mariachi",
   bars:bars("G4 B4 D5 B4|C5 E5 G5 E5|D5 Fs5 A5 Fs5|G5 - D5 -|B4 B4 C5 D5|E5 E5 D5 C5|A4 B4 C5 A4|G4 - - -|G5 Fs5 E5 B4|C5 D5 E5 C5|D5 E5 Fs5 D5|G5 - G5 -|E5 G5 E5 C5|D5 B4 G4 B4|A4 C5 Fs5 A5|G5 - - -"),
   ch:"G C D G G C D G Em C D G C G D G".split(" ")},
  {id:"cumbia",beats:4,eighth:.175,style:"cumbia",
   bars:bars("E5 - E5 -|E5 - - -|E5 - E5 -|E5 - - -|E5 - G5 -|C5 - - D5|E5 - - -|- - - -|F5 - F5 -|F5 - - F5|F5 - E5 -|E5 - E5 E5|E5 - D5 -|D5 - E5 -|D5 - - -|G5 - - -"),
   ch:"C C C C C C C C F F C C G G G G".split(" ")},
  {id:"son",beats:6,eighth:.15,style:"son",
   bars:bars("A4 - D5 Fs5 - E5|D5 - A4 B4 - A4|G4 - B4 D5 - Cs5|B4 - - A4 - -|A4 - D5 Fs5 - A5|G5 - Fs5 E5 - D5|E5 - G5 Fs5 - E5|D5 - - - - -|Fs5 - Fs5 G5 - A5|B5 - A5 Fs5 - D5|G5 - G5 Fs5 - E5|A5 - - - - -|Fs5 - A5 G5 - E5|D5 - Fs5 E5 - Cs5|D5 - E5 Fs5 - E5|D5 - - - - -"),
   ch:"D D G A D G A D D G G A D A A D".split(" ")}
];
let song=SONGS[1], songIdx=1;
function setSong(i){ songIdx=((i%SONGS.length)+SONGS.length)%SONGS.length; song=SONGS[songIdx]; }
// little instrument helpers, all routed into the music bus
function v(type,f,t,dur,peak,lp,att,det){ const a=A(); if(!a) return; const o=a.createOscillator(),g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(det) o.detune.setValueAtTime(det,t);
  let out=g; if(lp){ const fl=a.createBiquadFilter(); fl.type="lowpass"; fl.frequency.value=lp; o.connect(fl).connect(g); } else o.connect(g);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+(att||.006)); g.gain.exponentialRampToValueAtTime(.0001,t+dur); g.connect(BUS); o.start(t); o.stop(t+dur+.05); }
function trumpet(f,t,dur){ v("sawtooth",f,t,dur,.05,2300,.025,-7); v("sawtooth",f,t,dur,.05,2300,.025,7); v("square",f*2,t,dur*.8,.012,3000,.03); }
function marimba(f,t,dur){ v("triangle",f,t,Math.min(.5,dur),.2); v("sine",f*4,t,.08,.04); }
function accordion(f,t,dur){ v("square",f,t,dur,.035,1700,.02,-9); v("square",f,t,dur,.035,1700,.02,9); v("triangle",f/2,t,dur,.05); }
function pluck(f,t,peak){ v("sawtooth",f,t,.22,peak||.05,1800,.003); }
function harp(f,t){ v("triangle",f,t,.35,.09); v("sine",f*2,t,.18,.03); }
function strum(chord,t,oct,peak){ chord.forEach((m,j)=>pluck(HZ(m+(oct||0)),t+j*.012,peak||.045)); }
function bassN(m,t,dur,peak){ v("triangle",HZ(m),t,dur,peak||.32); v("sine",HZ(m),t,dur,(peak||.32)*.5); }
function shaker(t,peak){ noise(t,.06,peak,"highpass",6000); }
function guiro(t,long){ noise(t,long?.14:.05,long?.09:.06,"bandpass",3200); }
function bombo(t){ v("sine",90,t,.25,.35); v("sine",55,t,.3,.25); }
function stomp(t){ noise(t,.08,.14,"lowpass",400); v("sine",70,t,.12,.18); }
function bells(t){ for(let i=0;i<4;i++) v("triangle",2800+Math.random()*1500,t+i*.035,.18,.03); }
function playBar(sg,b,t){
  const bar=sg.bars[b%sg.bars.length], ch=sg.ch[b%sg.ch.length], E=sg.eighth, chord=CHD[ch], bs=BASS[ch];
  // melody
  bar.forEach((n,i)=>{ if(n==="-"||n==="R") return; let len=1; for(let k=i+1;k<bar.length&&bar[k]==="-";k++) len++; const f=HZ(NOTEN(n)), tt=t+i*E, d=Math.min(.9,len*E*.92);
    if(sg.style==="mariachi"){ trumpet(f,tt,d); marimba(f/2,tt,d); }
    else if(sg.style==="cumbia") accordion(f,tt,d);
    else { pluck(f,tt,.09); v("triangle",f,tt,d,.12); } });
  if(sg.style==="mariachi"){ bassN(bs[0],t,E*1.7); bassN(bs[1],t+2*E,E*1.7);                       // guitarrón on the beats
    [1,3].forEach(k=>strum(chord,t+k*E)); [0,1,2,3].forEach(k=>shaker(t+k*E,k%2?.05:.03)); if(b%4===3) bells(t+2*E); }
  else if(sg.style==="cumbia"){ bassN(bs[0],t,E*1.5,.34); bassN(bs[1],t+2*E,E*.9,.28); bassN(bs[0]+12,t+3*E,E*.8,.2);   // bass: root, fifth, octave
    bombo(t); [1,3].forEach(k=>chord.forEach(m=>v("square",HZ(m),t+k*E,E*.6,.016,1500)));                                 // accordion chops
    [0,1,2,3].forEach(k=>guiro(t+k*E,k%2===1)); if(b%8===7) bells(t+3*E); }
  else { bassN(bs[0],t,E*2.6,.3); bassN(bs[1],t+3*E,E*2.6,.26);                                         // son jarocho 6/8
    [0,2,3,5].forEach(k=>strum(chord,t+k*E,12,.035)); [0,3].forEach(k=>stomp(t+k*E));                    // jarana + zapateado
    chord.concat([chord[0]+12,chord[1]+12]).forEach((m,i)=>harp(HZ(m+12),t+i*E*.5)); }                  // harp runs
}

// extra layers when the game heats up
function hype(sg,b,t){ const E=sg.eighth, n=sg.beats;
  if(HYPE>=1){ for(let k=0;k<n*2;k++) noise(t+k*E/2,.04,k%2?.03:.05,"highpass",7000); [1,3].forEach(k=>{ if(k<n) noise(t+k*E,.09,.12,"bandpass",1500); }); }
  if(HYPE>=2){ for(let k=0;k<n;k++){ v("sine",90,t+k*E,.2,.3); } bells(t); if(b%2) bells(t+E*(n-1)); v("sawtooth",HZ(CHD[sg.ch[b%sg.ch.length]][2]+12),t,E*n*.9,.018,2600,.05); } }
function start(i){ const a=A(); if(!a) return; if(on) stop(); if(i!=null) setSong(i); on=true; nb=0; bt=a.currentTime+.12;
  timer=setInterval(()=>{ const ac=getCtx(); if(!ac||!on) return; while(bt<ac.currentTime+.5){ const sg=Object.assign({},song,{eighth:song.eighth/RATE}); playBar(sg,nb,bt); hype(sg,nb,bt); bt+=sg.beats*sg.eighth; nb++; } },90); }
function stop(){ on=false; clearInterval(timer); }
// stingers go to their own bus so they cut through the band
function sv(type,f,t,dur,peak,slide,lp){ const a=A(); if(!a) return; const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  let n=o; if(lp){ const fl=a.createBiquadFilter(); fl.type="lowpass"; fl.frequency.value=lp; o.connect(fl); n=fl; } n.connect(g); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur); g.connect(SFX); o.start(t); o.stop(t+dur+.05); }
const T=()=>{ const a=A(); return a?a.currentTime:0; };
const sting={
  fanfare(){ const t=T(); [[67,0,.12],[72,.12,.12],[76,.24,.12],[79,.36,.5]].forEach(([m,o,d])=>{ sv("sawtooth",HZ(m),t+o,d,.09,0,2600); sv("sawtooth",HZ(m-4),t+o,d,.06,0,2400); }); noise(t+.36,.5,.12,"highpass",6000,0,SFX); },
  big(){ const t=T(); [[67,0],[67,.09],[67,.18],[72,.3],[76,.42],[79,.54],[84,.7]].forEach(([m,o],i)=>{ const d=i===6?.7:.08; sv("sawtooth",HZ(m),t+o,d,.1,0,2800); sv("sawtooth",HZ(m-5),t+o,d,.07,0,2400); }); for(let i=0;i<6;i++) sv("triangle",2600+Math.random()*1500,t+.7+i*.05,.2,.04); },
  grito(){ const t=T(); // ¡ajúa! a rising yelp, a held "ú", a falling "a"
    sv("sawtooth",380,t,.16,.07,720,1800); sv("sawtooth",720,t+.15,.34,.08,980,2200); sv("sawtooth",980,t+.48,.32,.07,420,1900); noise(t,.12,.05,"bandpass",2500,0,SFX); },
  cheer(n){ const t=T(), k=n||1; noise(t,.9*k,.16*k,"bandpass",1200,2400,SFX); noise(t+.05,.8*k,.1*k,"bandpass",600,1100,SFX); for(let i=0;i<4*k;i++) noise(t+Math.random()*.6,.05,.06,"highpass",3500,0,SFX); },
  awww(){ const t=T(); noise(t,.8,.12,"bandpass",900,350,SFX); },
  wah(){ const t=T(); [[466,.0],[440,.3],[415,.6],[392,.9]].forEach(([f,o],i)=>sv("sawtooth",f,t+o,i===3?.8:.28,.07,i===3?370:0,1200)); },
  tick(hi){ const t=T(); sv("square",hi?1320:880,t,.05,.06); sv("sine",hi?2640:1760,t,.03,.03); },
  ladder(n){ const t=T(), sc=[0,2,4,7,9,12,14,16,19,21,24]; const m=72+sc[Math.min(sc.length-1,n)]; sv("triangle",HZ(m),t,.14,.09); sv("sine",HZ(m+12),t+.02,.1,.04); },
  key(){ const t=T(); [0,4,7,12].forEach((s,i)=>sv("square",HZ(79+s),t+i*.05,.1,.05)); }
};
return {init(c,o){ getCtx=c; getOut=o||(()=>null); }, start, stop, setRate(r){ RATE=r; }, setHype(h){ HYPE=h; }, get on(){ return on; }, sting, setSong};
})();


/* ---------- MARIACHI: reveal-night band, built from the same instruments as the piñata game (santa-reveal):
   sawtooth trumpets in thirds (lowpass 2600, vibrato), triangle violins an octave up, triangle guitarrón, square vihuela strums,
   the game's bonk/smash for the piñata, plus a snare roll and a banda burst made from the same trumpet voice.
   Music: an original mariachi ranchera arrangement of "Campana sobre campana" (traditional Spanish villancico, public domain). */
const MAR=(()=>{ let ac=null, master=null, bus=null, fx=null, NB=null, timer=null, on=false, nextT=0, step=0, loud=1, nodes=[];
  const HZ=n=>440*Math.pow(2,(n-69)/12), E=.14; // one 8th note (~107 bpm, a bright ranchera)
  const L5=[[74,2],[79,4],[78,1],[76,1],[74,2],[72,1],[71,1],[74,4]];
  const A=[ [62,1],[67,1],[67,1],[69,1],[71,2],[71,1],[69,1],[71,1],[72,1],[71,2],[69,4],
            [62,1],[69,1],[69,1],[71,1],[72,2],[72,1],[71,1],[72,1],[74,1],[72,2],[71,4],
            [74,1],[74,1],[74,1],[76,1],[74,2],[72,1],[71,1],[72,1],[72,1],[71,1],[69,1],[71,4],
            [72,1],[72,1],[71,1],[69,1],[71,2],[69,1],[67,1],[66,1],[66,1],[69,2],[67,4],
            ...L5,
            [72,1],[72,1],[72,1],[76,1],[74,2],[72,1],[71,1],[69,4],[66,1],[67,1],[69,2],
            ...L5,
            [72,1],[71,1],[69,1],[72,1],[71,2],[69,1],[66,1],[67,6],[0,2] ];
  const CH="G G G D D C D G G G C G C G D G G G G D C G D D G G G D C D G G".split(" "); // one chord per half bar
  const CN={G:[55,59,62,67],C:[55,60,64,67],D:[57,62,66,69]}, BS={G:[43,50],C:[48,43],D:[50,45]};
  const ORD=[0,2,4,5,7,9,11], third=m=>{ const pc=((m-67)%12+12)%12; const i=ORD.indexOf(pc); if(i<0) return m-3; const oc=Math.floor((m-67)/12), j=i-2; return 67+oc*12+(j<0?ORD[j+7]-12:ORD[j]); };
  const MEL=[]; { let t=0; A.forEach(([n,d])=>{ MEL.push({t,n,d}); t+=d; }); } const LOOP=128;
  function ctx(){ if(ac) return ac; ac=tvAudio(); if(!ac) return null;
    const comp=ac.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
    const lim=ac.createDynamicsCompressor(); lim.threshold.value=-3; lim.knee.value=0; lim.ratio.value=20; lim.attack.value=.001; lim.release.value=.1;
    master=ac.createGain(); master.gain.value=1.35; master.connect(comp).connect(lim).connect(ac.destination);
    bus=ac.createGain(); bus.gain.value=0; bus.connect(master); fx=ac.createGain(); fx.gain.value=1; fx.connect(master);
    NB=ac.createBuffer(1,ac.sampleRate,ac.sampleRate); const d=NB.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return ac; }
  function env(g,t,a,peak,dec){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+dec); }
  // the piñata game's osc(): same envelope, filter and vibrato
  function osc(type,freq,t,dur,peak,o){ o=o||{}; const x=ac.createOscillator(), g=ac.createGain(); x.type=type; x.frequency.setValueAtTime(freq,t); if(o.slide) x.frequency.exponentialRampToValueAtTime(o.slide,t+dur);
    let out=x; if(o.lp){ const f=ac.createBiquadFilter(); f.type="lowpass"; f.frequency.value=o.lp; x.connect(f); out=f; }
    if(o.vib){ const l=ac.createOscillator(), lg=ac.createGain(); l.frequency.value=o.shake?11:5.6; lg.gain.value=freq*o.vib; l.connect(lg).connect(x.frequency); l.start(t); l.stop(t+dur+.1); }
    out.connect(g).connect(o.dest||bus);
    if(o.sustain){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+.03); g.gain.setValueAtTime(peak*.8,t+Math.max(.04,dur-.06)); g.gain.exponentialRampToValueAtTime(.0001,t+dur); }
    else env(g,t,.005,peak,dur);
    x.start(t); x.stop(t+dur+.05); if(!o.dest) nodes.push(x); }
  function noise(t,dur,peak,type,f0,f1,dest){ const s=ac.createBufferSource(); s.buffer=NB; const f=ac.createBiquadFilter(); f.type=type; f.Q.value=type==="bandpass"?1.2:.7;
    f.frequency.setValueAtTime(f0,t); if(f1) f.frequency.exponentialRampToValueAtTime(f1,t+dur); const g=ac.createGain(); env(g,t,dur*.35,peak,dur*.65);
    s.connect(f).connect(g).connect(dest||bus); s.start(t,Math.random()*.5); s.stop(t+dur+.05); }
  // mariachi section (exactly the piñata song's voices)
  const trumpet=(m,t,d,v,dest,x)=>{ x=x||{}; osc("sawtooth",HZ(m),t,d,v,Object.assign({lp:2600,vib:x.shake?.03:.006,sustain:true,dest},x)); };
  const section=(m,t,d,k,dest,x)=>{ trumpet(m,t,d,.16*k,dest,x); trumpet(third(m),t,d,.11*k,dest,Object.assign({lp:2300},x||{})); osc("triangle",HZ(m)*2,t,d*.95,.05*k,{vib:.012,sustain:true,dest}); };
  function tick(){ if(!on||!ac) return; while(nextT<ac.currentTime+.2){ const k=step%LOOP, half=Math.floor(k/4), ch=CH[half], t=nextT, b8=k%8;
      if(b8===0||b8===4) osc("triangle",HZ(BS[ch][b8?1:0]),t,E*2.4,.5);                                            // guitarrón on 1 & 3
      if(b8===2||b8===6) CN[ch].forEach((m,j)=>osc("square",HZ(m),t+j*.012,.12,.035,{lp:1800}));                   // vihuela on 2 & 4
      if(b8===3||b8===7) CN[ch].slice(1).forEach((m,j)=>osc("square",HZ(m),t+j*.01,.07,.02,{lp:1600}));
