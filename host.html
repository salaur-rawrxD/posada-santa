  const save=()=>{ try{ S?localStorage.setItem(AK,JSON.stringify(S)):localStorage.removeItem(AK); }catch(e){} };
  const H=tk=>({"Content-Type":"application/json",apikey:SB_KEY,Authorization:"Bearer "+(tk||SB_KEY)});
  async function call(path,opt){ const c=new AbortController(), tm=setTimeout(()=>c.abort(),12000); try{ return await fetch(SB_URL+path,Object.assign({},opt,{signal:c.signal})); } finally{ clearTimeout(tm); } }
  function setSession(j,keepUser){ if(!j||!j.access_token) return false; const u=j.user?{id:j.user.id,email:j.user.email}:keepUser||{}; S={at:j.access_token,rt:j.refresh_token,exp:Date.now()+((j.expires_in||3600)-60)*1000,user:u}; save(); return true; }
  async function token(){ if(!S) return null; if(Date.now()<S.exp) return S.at;
    try{ const r=await call("/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:H(),body:JSON.stringify({refresh_token:S.rt})});
      if(r.ok){ setSession(await r.json(),S.user); return S.at; } if(r.status===400||r.status===401){ S=null; save(); } }catch(e){} return null; }
  async function sendCode(email){ try{ const r=await call("/auth/v1/otp?redirect_to="+encodeURIComponent(ORIGIN+"/host"),{method:"POST",headers:H(),body:JSON.stringify({email,create_user:true})}); return r.ok?"ok":r.status===429?"rate":"err"; }catch(e){ return "net"; } }
  async function verify(email,code){ try{ const r=await call("/auth/v1/verify",{method:"POST",headers:H(),body:JSON.stringify({type:"email",email,token:code})}); if(r.status===429) return "rate"; if(!r.ok) return "bad"; return setSession(await r.json())?"ok":"bad"; }catch(e){ return "net"; } }
  async function rest(method,q,body,prefer){ const tk=await token(); if(!tk) throw new Error("auth"); const h=H(tk); if(prefer) h.Prefer=prefer;
    const r=await call("/rest/v1/organizer_groups"+q,{method,headers:h,body:body?JSON.stringify(body):undefined}); if(r.status===401){ S=null; save(); throw new Error("auth"); } if(!r.ok) throw new Error("rest "+r.status); return method==="GET"?r.json():null; }
  let tq=null; const dirty=new Set();
  function queue(){ if(!S) return; const g=DB.groups[DB.cur]; if(g&&g.setup) dirty.add(g.gid); clearTimeout(tq); tq=setTimeout(flush,1200); }
  async function flush(){ if(!S||!dirty.size) return; const rows=[...dirty].map(id=>DB.groups[id]).filter(g=>g&&g.setup).map(g=>({user_id:S.user.id,gid:g.gid,data:g})); dirty.clear(); if(!rows.length) return;
    try{ await rest("POST","?on_conflict=user_id,gid",rows,"resolution=merge-duplicates,return=minimal"); }catch(e){ rows.forEach(r=>dirty.add(r.gid)); } }
  async function sync(){ if(!S) return; try{ const rows=await rest("GET","?select=gid,data,updated_at"), have=new Set();
      rows.forEach(r=>{ const R=r.data, L=DB.groups[r.gid]; have.add(r.gid); if(!R||!R.gid) return; if(!L||(R.ut||0)>(L.ut||0)) DB.groups[r.gid]=R; else if((L.ut||0)>(R.ut||0)) dirty.add(r.gid); });
      Object.values(DB.groups).forEach(g=>{ if(g.setup&&!have.has(g.gid)) dirty.add(g.gid); });
      try{ localStorage.setItem(SKEY,JSON.stringify(DB)); }catch(e){} await flush(); }catch(e){} }
  async function remove(gid){ if(!S) return; try{ await rest("DELETE","?gid=eq."+encodeURIComponent(gid)); }catch(e){} }
  async function signOut(){ const tk=S&&S.at; S=null; save(); if(tk) try{ await call("/auth/v1/logout",{method:"POST",headers:H(tk)}); }catch(e){} }
  // if someone taps the link in the email instead of typing the code
  (()=>{ const q=new URLSearchParams(location.hash.slice(1)); if(q.get("access_token")&&q.get("refresh_token")){ let u={};
      try{ const p=JSON.parse(decodeURIComponent(escape(atob(q.get("access_token").split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))))); u={id:p.sub,email:p.email}; }catch(e){}
      S={at:q.get("access_token"),rt:q.get("refresh_token"),exp:Date.now()+((+q.get("expires_in")||3600)-60)*1000,user:u}; save(); window.__magic=1; try{ history.replaceState(null,"",location.pathname); }catch(e){} } })();
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flush(); });
  return {user:()=>S&&S.user,sendCode,verify,queue,sync,flush,remove,signOut};
})();

/* ---------- sealed codes ---------- */
function seal(o,pre){ const b=new TextEncoder().encode(JSON.stringify(o)); let s=""; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]^KEY.charCodeAt(i%KEY.length)); return pre+btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unseal(c,pre){ try{ if(!c||c[0]!==pre) return null; let s=c.slice(1).replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; const bin=atob(s), b=new Uint8Array(bin.length); for(let i=0;i<b.length;i++) b[i]=bin.charCodeAt(i)^KEY.charCodeAt(i%KEY.length); return JSON.parse(new TextDecoder().decode(b)); }catch(e){ return null; } }
// piñata codes use the reveal page's hex format
function pinCode(obj){ const b=new TextEncoder().encode(JSON.stringify(obj)); let h="x"; for(let i=0;i<b.length;i++) h+=(b[i]^KEY.charCodeAt(i%KEY.length)).toString(16).padStart(2,"0"); return h; }
function pinDecode(code){ try{ const hex=code.slice(1), b=new Uint8Array(hex.length/2); for(let i=0;i<b.length;i++) b[i]=parseInt(hex.substr(i*2,2),16)^KEY.charCodeAt(i%KEY.length); return JSON.parse(new TextDecoder().decode(b)); }catch(e){ return null; } }

function loadDB(){ try{ const v=JSON.parse(localStorage.getItem(SKEY)||"null"); if(v&&v.groups) return v; }catch(e){ canSave=false; } return {v:1,cur:null,ui:null,groups:{}}; }

function persist(){ const g=DB.groups&&DB.groups[DB.cur]; if(g) g.ut=Date.now(); try{ localStorage.setItem(SKEY,JSON.stringify(DB)); canSave=true; }catch(e){ canSave=false; } if(typeof AUTH!=="undefined") AUTH.queue(); }

/* ---------- the family game leaderboard (travels inside links, no server) ---------- */
function boardRows(g){ g=g||G(); return Object.values(g.board||{}).filter(r=>r.s>0).sort((a,b)=>b.s-a.s||a.n.localeCompare(b.n)); }
function boardEntries(g){ return boardRows(g).slice(0,20).map(r=>[r.n,r.s,r.st||0,r.lv||0,r.t||0]); }
function boardCode(g){ g=g||G(); return seal({gid:g.gid,gn:g.name,e:boardEntries(g)},"S"); }
function mergeBoard(g,entries){ g.board=g.board||{}; let ch=0; (entries||[]).forEach(([n,sc,st,lv,ts])=>{ const k=norm(n); if(!k) return; const o=g.board[k]; if(!o||sc>o.s){ g.board[k]={n,s:+sc||0,st:+st||0,lv:+lv||0,t:+ts||0}; ch++; } }); return ch; }
function findBoards(text){ const out=[]; (String(text||"").match(/sb=(S[A-Za-z0-9_-]{8,})/g)||[]).forEach(m=>{ const o=unseal(m.slice(3),"S"); if(o&&o.gid) out.push(o); }); return out; }
function importBoards(list){ let n=0; list.forEach(o=>{ const g=DB.groups[o.gid]; if(g) n+=mergeBoard(g,o.e)||0.0001; }); if(n){ persist(); render(); toast(t("lbUpdated")); } return n>0; }
function importAny(text){ const a=importLetters(findLetters(text)), b=importBoards(findBoards(text)); return a||b; }
const GAME_SHARE=g=>`${GAME_URL}#sb=${boardCode(g)}&me=${encodeURIComponent(g.org.name||"")}`;

function groupCode(g){ const o={gid:g.gid,gn:g.name,on:g.org.name,op:g.org.phone||"",b:g.budget||"",d:g.party||"",pl:g.place||"",dl:g.deadline||"",l:g.lang||"en"}; const e=boardEntries(g).slice(0,8); if(e.length) o.sb=e; return seal(o,"G"); }
function inviteURL(p){ const g=G(); return `${LETTER_URL}#g=${groupCode(g)}${p?`&n=${encodeURIComponent(p.name)}&l=${p.lang||g.lang}`:""}`; }
function lines(g,l){ const es=l==="es", a=[];
  if(g.deadline) a.push((es?"📮 Cartas antes del ":"📮 Letters due ")+fmtDate(g.deadline,l));
  if(g.budget) a.push((es?"🎁 Presupuesto: ":"🎁 Gift budget: ")+g.budget);
  if(g.party) a.push((es?"🎄 Intercambio: ":"🎄 Gift exchange: ")+fmtDate(g.party,l)+(g.place?(es?" en ":" at ")+g.place:""));
  return a.join("\n"); }
function msgInvite(p,reminder){ const g=G(), l=p?p.lang||g.lang:g.lang, o=first(g.org.name), n=p?first(p.name):"", x=lines(g,l), url=inviteURL(p);
  if(l==="es") return reminder
    ? `🎄 ¡Hola ${n}! Un recordatorio de ${o}: todavía falta tu carta a Santa para ${g.name} 🎁\n\nSolo toma 3 minutos:\n${url}\n${x?"\n"+x+"\n":""}\nAl terminar, un toque me la manda. ¡Gracias! 🌟`
    : `🎄✨ ¡Feliz Navidad${n?", "+n:""}! ✨🎄\n\n${o} está organizando el Secret Santa de ${g.name} 🎁 Escribe aquí tu carta a Santa, toma unos 3 minutos:\n\n${url}\n${x?"\n"+x+"\n":""}\nAl terminar, un toque me la manda. ¡Nos vemos! 🌟`;
  return reminder
    ? `🎄 Hi ${n}! Friendly reminder from ${o}: your letter to Santa for ${g.name} is still missing 🎁\n\nIt only takes 3 minutes:\n${url}\n${x?"\n"+x+"\n":""}\nWhen you finish, one tap sends it to me. Thank you! 🌟`
    : `🎄✨ ¡Feliz Navidad${n?", "+n:""}! ✨🎄\n\n${o} is running the Secret Santa for ${g.name} 🎁 Write your letter to Santa here, it takes about 3 minutes:\n\n${url}\n${x?"\n"+x+"\n":""}\nWhen you finish, one tap sends it to me. ¡Nos vemos! 🌟`; }
function msgPinata(p,code){ const g=G(), l=p.lang||g.lang, n=first(p.name), x=[g.budget&&((l==="es"?"🎁 Presupuesto: ":"🎁 Gift budget: ")+g.budget),g.party&&((l==="es"?"🎄 Intercambio: ":"🎄 Gift exchange: ")+fmtDate(g.party,l)+(g.place?(l==="es"?" en ":" at ")+g.place:""))].filter(Boolean).join("\n");
  if(l==="es") return `🎄✨ ¡Feliz Navidad, ${n}! ✨🎄\n\n¡Ya se sortearon los nombres de ${g.name}! Tu Secret Santa está dentro de una piñata 🪅 Toca abajo y pégale hasta que se rompa 👇\n\n${REVEAL_URL}#${code}&sb=${boardCode(g)}\n${x?"\n"+x+"\n":""}\n🤫 Shhh… este link es solo para ti. ¡No se vale espiar ni compartir! 🌟\n\n(Si la página te pide tu código, copia todo este mensaje y pégalo ahí.)`;

/* ---------- groups & people ---------- */
function newGroup(){ const gid=uid(); DB.groups[gid]={gid,name:"",org:{name:"",phone:"",plays:true,id:uid()},lang:ui(),budget:"",party:"",place:"",deadline:"",people:[],pairs:[],draw:null,created:Date.now()}; DB.cur=gid; persist(); return DB.groups[gid]; }
function syncOrganizer(){ const g=G(), o=g.org; let me=g.people.find(p=>p.me);
  if(o.plays){ if(!me){ me={id:o.id,me:true,name:o.name,phone:o.phone,lang:g.lang,inv:Date.now(),letter:null}; g.people.unshift(me); } else { me.name=o.name; me.phone=o.phone; } }
  else if(me){ g.people=g.people.filter(p=>!p.me); g.pairs=g.pairs.filter(pr=>!pr.includes(me.id)); } }
function findPerson(name,phone){ const g=G(), pk=phoneKey(phone);
  if(pk.length>=7){ const m=g.people.find(p=>phoneKey(p.phone)===pk); if(m) return m; }
  const nn=norm(name); let m=g.people.find(p=>norm(p.name)===nn); if(m) return m;
  const f=norm(first(name)); const fm=g.people.filter(p=>norm(first(p.name))===f); return fm.length===1&&(!pk||!fm[0].phone)?fm[0]:null; }
function addPerson(name,phone){ name=String(name||"").trim().replace(/\s+/g," "); if(!name) return null; const g=G(); if(PLUSCFG()&&!isPlus()&&g.people.length>=PLUS_FREE_MAX){ window.__capHit=true; return null; }
  if(g.people.some(p=>norm(p.name)===norm(name)||(phoneKey(phone).length>=7&&phoneKey(p.phone)===phoneKey(phone)))) return false;
  const p={id:uid(),name,phone:String(phone||"").trim(),lang:g.lang,inv:0,letter:null}; g.people.push(p); return p; }
function parseList(text){ const out=[]; String(text||"").split(/\r?\n/).forEach(line=>{ line=line.trim().replace(/^[-•*\d.)\s]+(?=\D)/,""); if(!line) return;
    const m=line.match(/(\+?[\d][\d\s().-]{6,}\d)\s*$/); if(m){ const nm=line.slice(0,m.index).replace(/[,;:\-–—\t|]+\s*$/,"").trim(); if(nm) out.push([nm,m[1]]); return; }
    line.split(/\s*[,;]\s*/).filter(Boolean).forEach(nm=>out.push([nm,""])); }); return out; }
function addMany(list){ let a=0,d=0; list.forEach(([n,ph])=>{ const r=addPerson(n,ph); if(r) a++; else if(r===false) d++; }); persist(); toast(t("added",a)+(d?" · "+t("dupe",d):"")); return a; }
const pending=D=>Object.keys(D.cards).filter(k=>(!D.sent[k]||D.redo[k])&&!(P(k)||{}).me);
const status=p=>{ const D=G().draw; if(D&&D.cards[p.id]){ if(p.me) return ["sent",t("you")]; if(D.redo[p.id]) return ["redo",t("stRedo")]; if(D.sent[p.id]) return ["sent",t("stSent")]; return ["inv",t("stReady")]; } return p.letter?["in",t("stIn")]:p.me?["new",t("you")]:p.inv?["inv",t("stInv")]:["new",t("stNew")]; };

/* ---------- letters coming in ---------- */
function findLetters(text){ const s=String(text||""), out=[], seen=new Set();
  (s.match(/letter=(L[A-Za-z0-9_-]{20,})/g)||[]).forEach(m=>seen.add(m.slice(7)));
  (s.match(/\bL[A-Za-z0-9_-]{60,}/g)||[]).forEach(m=>seen.add(m));
  seen.forEach(c=>{ const o=unseal(c,"L"); if(o&&o.gid&&o.n) out.push(o); }); return out; }
function importLetters(list){ if(!list.length) return false; const results=[];
  list.forEach(L=>{ const g=DB.groups[L.gid]; if(!g){ results.push({other:true}); return; } DB.cur=L.gid;
    let p=findPerson(L.n,L.ph), isNew=false, had=false;
    if(p&&p.letter&&p.letter.t&&p.letter.t===L.t) return;
    if(!p){ p=addPerson(L.n,L.ph)||findPerson(L.n,L.ph); isNew=true; }
    had=!!p.letter; p.letter=L; p.la=Date.now(); p.lang=L.l||p.lang; if(L.ph&&!p.phone) p.phone=L.ph;
    if(p.me) p.lang=L.l||p.lang;
    let redo=false, late=false; const D=g.draw;
    if(D){ const giver=Object.keys(D.cards).find(k=>D.cards[k].r===p.id);
      if(giver){ D.cards[giver].code=codeFor(P(giver),p); if(D.sent[giver]){ D.redo[giver]=true; redo=true; } } else late=true; }
    results.push({p,isNew,had,redo,late}); });
  persist(); render(); if(results.length) showImport(results); return true; }
function showImport(rs){ const r=rs.find(x=>!x.other)||rs[0];
  if(r.other){ sheet(`<div class="sheethead"><div class="stack tight"><span class="kicker">📮</span><h2>${esc(t("lOther"))}</h2></div>${closeBtn()}</div><p>${esc(t("lOtherP"))}</p><button class="cta" data-act="closeSheet">${esc(t("lOk"))}</button>`); return; }
  burst(["📮","🎁","✨","⭐","🎄"]);
  const L=r.p.letter, extra=rs.filter(x=>!x.other).length-1;
  sheet(`<div class="sheethead"><div class="big-name"><div class="av" style="--c:${colorOf(r.p.id)}">${esc(ini(r.p.name)||"?")}</div><div class="stack tight"><span class="kicker">${esc(r.had?t("lUpdated",first(r.p.name)):t("lAdded",first(r.p.name)))}</span><h2>${esc(r.p.name)}</h2></div></div>${closeBtn()}</div>
    ${letterSummary(L)}
    ${r.isNew?`<div class="ok">${esc(t("lNew",first(r.p.name)))}</div>`:""}${r.redo?`<div class="warn">${esc(t("lRedo"))}</div>`:""}${r.late?`<div class="warn">${esc(t("lLate"))}</div>`:""}
    ${extra>0?`<p class="fine">+${extra} ${ui()==="es"?"cartas más":"more letters"} ✓</p>`:""}
    <button class="cta" data-act="closeSheet">${esc(t("lOk"))}</button>`); }
function letterSummary(L){ if(!L) return `<p class="fine">${esc(t("noLetter"))}</p>`; const sz=[L.s&&"👕 "+L.s,L.p&&"👖 "+L.p,L.h&&"👟 "+L.h].filter(Boolean).join("  ");
  return `<div class="lettersum">${sz?`<small>${esc(t("sizes"))}</small><b>${esc(sz)}</b>`:""}<small>${esc(t("wishes"))}</small><b>${(L.g||[]).map((w,i)=>esc((i+1)+". "+w)).join("<br>")||"—"}</b>
    ${L.x&&(L.x.vb||L.x.lv)?`<small>✨</small><b>${esc([L.x.vb,L.x.lv].filter(Boolean).join(" · "))}</b>`:""}</div>`; }

/* ---------- the draw ---------- */
function rand(n){ const u=new Uint32Array(1); crypto.getRandomValues(u); return u[0]%n; }
function blocked(a,b){ return G().pairs.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a)); }
function makeDraw(ids){ for(let tr=0;tr<40000;tr++){ const r=[...ids]; for(let i=r.length-1;i>0;i--){ const j=rand(i+1); [r[i],r[j]]=[r[j],r[i]]; }
    if(ids.every((g,i)=>g!==r[i]&&!blocked(g,r[i]))) return ids.map((g,i)=>[g,r[i]]); } return null; }
function codeFor(giver,rec){ const L=rec.letter||{}, o={n:first(giver.name),l:giver.lang||G().lang,r:rec.name,s:L.s||"",p:L.p||"",h:L.h||"",g:L.g||[]}; if(L.x&&Object.keys(L.x).length) o.x=L.x; return pinCode(o); }
function drawPool(){ const g=G(); return g.people.filter(p=>p.letter||g.includeAll); }
function doDraw(){ const g=G(), pool=drawPool(); if(pool.length<3){ toast(t("dNeed3")); return; }
  const pairs=makeDraw(pool.map(p=>p.id)); if(!pairs){ sheet(`<div class="sheethead"><h2>🎲</h2>${closeBtn()}</div><div class="warn">${esc(t("dImpossible"))}</div><button class="cta" data-act="closeSheet">${esc(t("lOk"))}</button>`); return; }
  const cards={}; pairs.forEach(([a,b])=>{ cards[a]={r:b,code:codeFor(P(a),P(b))}; });
  g.draw={at:Date.now(),cards,sent:{},redo:{}}; persist(); closeSheet(); go("draw"); burst(["🪅","🎁","⭐","✨","🎉"]); toast(t("drew")); }

/* ---------- send queue ---------- */
let Q=null;
function startQueue(kind,ids){ if(!ids.length) return; Q={kind,ids,i:0,tapped:false}; renderQueue(); }
function qMessage(p){ const D=G().draw; return Q.kind==="pin"?msgPinata(p,D.cards[p.id].code):msgInvite(p,Q.kind==="rem"); }
function markSent(p){ const g=G(); if(Q.kind==="pin"){ g.draw.sent[p.id]=Date.now(); delete g.draw.redo[p.id]; } else if(Q.kind==="rem"){ p.rem=Date.now(); p.inv=p.inv||Date.now(); } else p.inv=Date.now(); persist(); render(); }
function renderQueue(){ if(!Q) return; const title={inv:t("qInv"),rem:t("qRem"),pin:t("qPin")}[Q.kind];
  if(Q.i>=Q.ids.length){ burst(["🎉","✨","🎄"]); sheet(`<div class="empty-st"><div class="e">🎉</div><h2>${esc(t("qDone"))}</h2><p>${esc(t("qDoneP"))}</p></div><button class="cta" data-act="closeSheet">${esc(t("qClose"))}</button>`); Q=null; return; }
  const p=P(Q.ids[Q.i]); if(!p){ Q.i++; renderQueue(); return; } const m=qMessage(p);
  sheet(`<div class="sheethead"><div class="stack tight"><span class="qcount">${esc(title)} · ${esc(t("qOf",Q.i+1,Q.ids.length))}</span>
      <div class="big-name"><div class="av" style="--c:${colorOf(p.id)}">${esc(ini(p.name)||"?")}</div><div><h2>${esc(p.name)}</h2><small class="help">${esc(p.phone?pretty(p.phone):t("qNoPhone"))}</small></div></div></div>${closeBtn()}</div>
    <div class="send3"><a class="cta wa" data-act="qSend" href="${esc(waLink(p.phone,m))}" target="_blank" rel="noopener">${esc(t("waBtn"))}</a><a class="cta im" data-act="qSend" href="${esc(imLink(p.phone,m))}">${esc(t("imBtn"))}</a><button class="cta alt" data-act="qCopy">${esc(t("cpBtn"))}</button></div>
    <details><summary>${esc(t("msgPrev"))}</summary><div class="preview">${esc(m)}</div></details>
    <div class="row"><button class="cta alt" data-act="qSkip" style="flex:1">${esc(t("qSkip"))}</button><button class="cta" id="qNext" data-act="qNext" style="flex:2" ${Q.tapped?"":"disabled"}>${esc(Q.tapped?t("qNext"):t("qNext"))}</button></div>`); }

function closeBtn(){ return `<button class="close" data-act="closeSheet" aria-label="Close">✕</button>`; }
function sheet(html){ $("sheetRoot").innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`; document.body.style.overflow="hidden"; }
function closeSheet(){ $("sheetRoot").innerHTML=""; document.body.style.overflow=""; Q=null; }
function burst(list){ if(matchMedia("(prefers-reduced-motion: reduce)").matches) return; const fx=$("confetti");
  for(let i=0;i<16;i++) setTimeout(()=>{ const s=document.createElement("span"); s.textContent=list[i%list.length]; fx.appendChild(s); const x=Math.random()*innerWidth, dr=(Math.random()*2-1)*80;
    s.animate([{transform:`translate(${x}px,-40px) rotate(0)`},{transform:`translate(${x+dr}px,${innerHeight+40}px) rotate(${(Math.random()*2-1)*360}deg)`}],{duration:2600+Math.random()*1600,easing:"cubic-bezier(.3,.1,.7,1)",fill:"forwards"}).onfinish=()=>s.remove(); },i*60); }

function backupText(){ return seal({k:"santa-backup",v:1,groups:DB.groups,cur:DB.cur},"B"); }
function restoreFrom(text){ const m=String(text||"").match(/B[A-Za-z0-9_-]{20,}/); const o=m&&unseal(m[0],"B"); if(!o||o.k!=="santa-backup"){ toast(t("badBackup")); return; }
  Object.assign(DB.groups,o.groups); DB.cur=o.cur||Object.keys(o.groups)[0]; persist(); closeSheet(); view="home"; render(); toast(t("restored")); }

/* ---------- actions ---------- */
function readWiz(){ const g=G(), v=id=>($(id)||{}).value;
  if(wiz===1){ g.name=(v("w_g")||"").trim(); g.org.name=(v("w_y")||"").trim(); g.org.phone=(v("w_p")||"").trim(); g.org.plays=$("w_play").getAttribute("aria-checked")==="true"; }
  if(wiz===2){ const c=(v("w_bc")||"").trim(); if(c) g.budget=c; g.party=v("w_d")||""; g.deadline=v("w_dl")||""; g.place=(v("w_pl")||"").trim(); }
  persist(); }
const ACT={
  ui:a=>{ if(wiz&&G()&&!G().setup) readWiz(); DB.ui=a.dataset.l; if(G()&&!G().setup) G().lang=DB.ui; persist(); render(); },
  tab:a=>go(a.dataset.v), tabDraw:()=>go("draw"),
  begin:()=>{ if(CLOUD()&&!ME()){ pendingAct={act:"begin",data:{}}; loginSheet("start"); return; } const g=Object.values(DB.groups).find(x=>!x.setup)||newGroup(); DB.cur=g.gid; g.lang=ui(); wiz=1; persist(); render(); setTimeout(()=>$("w_g")&&$("w_g").focus(),200); },
  toggle:a=>{ a.setAttribute("aria-checked",String(a.getAttribute("aria-checked")!=="true")); },
  bud:a=>{ const g=G(); g.budget=g.budget===a.dataset.b?"":a.dataset.b; $("w_bc").value=""; persist(); document.querySelectorAll("[data-act=bud]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.b===g.budget))); },
  glang:a=>{ G().lang=a.dataset.l; persist(); document.querySelectorAll("[data-act=glang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===a.dataset.l))); },
  wnext:()=>{ readWiz(); const g=G();
    if(wiz===1){ const e=$("werr"); if(!g.name){ e.textContent=t("needG"); e.hidden=false; $("w_g").focus(); return; } if(!g.org.name){ e.textContent=t("needY"); e.hidden=false; $("w_y").focus(); return; } syncOrganizer(); persist(); }
    if(wiz===3){ const n=$("a_n"); if(n&&n.value.trim()){ addPerson(n.value,$("a_p").value); } g.setup=true; view="home"; wiz=0; persist(); render(); burst(["🎄","✨","🎁","⭐"]); cloudRegister(g).then(()=>render()); return; }
    wiz++; render(); window.scrollTo(0,0); },
  wback:()=>{ readWiz(); if(wiz<=1){ wiz=0; } else wiz--; render(); },
  wskip:()=>{ wiz++; render(); },
  amode:a=>{ addMode=a.dataset.m; if($("sheetRoot").innerHTML) addSheet(); else render(); },
  pasteList:()=>{ const list=parseList($("a_list").value); if(!list.length) return; addMany(list); $("a_list").value=""; addMode="type"; refreshAfterAdd(); },
  contacts:async()=>{ try{ const cs=await navigator.contacts.select(["name","tel"],{multiple:true}); addMany(cs.map(c=>[(c.name||[])[0]||"",(c.tel||[])[0]||""]).filter(x=>x[0])); refreshAfterAdd(); }catch(e){ toast(t("contactsNo")); } },
  delQuick:a=>{ const g=G(); g.people=g.people.filter(p=>p.id!==a.dataset.id); g.pairs=g.pairs.filter(pr=>!pr.includes(a.dataset.id)); persist(); render(); },
  addOpen:()=>{ addMode="type"; addSheet(); },
  qInv:()=>startQueue("inv",G().people.filter(p=>!p.inv&&!p.letter&&!p.me).map(p=>p.id)),
  qRem:()=>startQueue("rem",G().people.filter(p=>!p.letter&&!p.me).map(p=>p.id)),
  qPin:()=>startQueue("pin",pending(G().draw)),
  qOne:a=>startQueue("pin",[a.dataset.id]),
  qSend:a=>{ if(!Q) return; const p=P(Q.ids[Q.i]); markSent(p); Q.tapped=true; setTimeout(()=>{ const b=$("qNext"); if(b){ b.disabled=false; b.textContent=t("qNext"); } },200); return "follow"; },
  qCopy:async()=>{ if(!Q) return; const p=P(Q.ids[Q.i]); if(await copy(qMessage(p))){ markSent(p); Q.tapped=true; const b=$("qNext"); if(b) b.disabled=false; } },
  qNext:()=>{ if(!Q) return; Q.i++; Q.tapped=false; renderQueue(); }, qSkip:()=>{ if(!Q) return; Q.i++; Q.tapped=false; renderQueue(); },
  closeSheet:()=>closeSheet(), scrim:(a,e)=>{ if(e.target===a) closeSheet(); },
  clipPaste:async()=>{ try{ const s=await navigator.clipboard.readText(); if(!importAny(s)) toast(t("mailBad")); }catch(e){ toast(t("pasteFail")); const d=document.querySelector(".mail details"); if(d){ d.open=true; $("mailBox").focus(); } } },
  mailAdd:()=>{ if(!importAny($("mailBox").value)) toast(t("mailBad")); },
  filter:a=>{ filter=a.dataset.f; render(); },
  person:a=>personSheet(a.dataset.id),
  pSend:a=>{ const p=P(a.dataset.id); if(p.inv) p.rem=Date.now(); p.inv=p.inv||Date.now(); persist(); render(); return "follow"; },
  pCopy:async a=>{ const p=P(a.dataset.id); if(await copy(msgInvite(p,!!p.inv))){ p.inv=p.inv||Date.now(); persist(); render(); } },
  pSave:a=>{ const p=P(a.dataset.id), n=$("e_n").value.trim(); if(n) p.name=n; p.phone=$("e_p").value.trim(); persist(); closeSheet(); render(); toast(t("saved")); },
  plang:a=>{ const g=G(), p=P(a.dataset.id); p.lang=a.dataset.l; if(g.draw){ Object.keys(g.draw.cards).forEach(k=>{ if(k===p.id){ g.draw.cards[k].code=codeFor(p,P(g.draw.cards[k].r)); } }); } persist(); render(); personSheet(p.id); },
  clearLetter:a=>{ const p=P(a.dataset.id); p.letter=null; persist(); closeSheet(); render(); },
  delQ:a=>{ const p=P(a.dataset.id); confirmSheet(t("removeQ",first(p.name)),G().draw?t("removeAfter"):"",t("removeY"),"delY",`data-id="${p.id}"`); },
  delY:a=>{ const g=G(), id=a.dataset.id; g.people=g.people.filter(p=>p.id!==id); g.pairs=g.pairs.filter(pr=>!pr.includes(id)); if(g.draw&&g.draw.cards[id]!==undefined||g.draw&&Object.values(g.draw.cards).some(c=>c.r===id)) g.draw=null; persist(); closeSheet(); render(); toast(t("removed")); },
  groupLink:()=>groupSheet(), groupSent:()=>"follow", sync:()=>cloudPull(true),
  lbShare:()=>{ const g=G(), rs=boardRows(g), es=g.lang==="es", url=`${GAME_URL}#sb=${boardCode(g)}`;
    const m=es?(rs.length?`🏆 ¡Así va la tabla de La Posada de ${g.name}! ${rs[0].n} va ganando con ${Number(rs[0].s).toLocaleString()} puntos 🪅 ¿Quién le gana? 👇\n\n${url}`:`🎮 ¡Ya está La Posada para ${g.name}! Juega, haz puntos y sube a la tabla de la familia 🪅👇\n\n${url}`)
      :(rs.length?`🏆 Here's the ${g.name} La Posada leaderboard! ${rs[0].n} is winning with ${Number(rs[0].s).toLocaleString()} points 🪅 Who can beat them? 👇\n\n${url}`:`🎮 La Posada is live for ${g.name}! Play, rack up points and get on the family leaderboard 🪅👇\n\n${url}`);
    sheet(`<div class="sheethead"><div class="stack tight"><span class="kicker">🏆</span><h2>${esc(t("lbShare"))}</h2></div>${closeBtn()}</div><p>${esc(t("groupP2"))}</p>
      <div class="send3"><a class="cta wa" href="${esc(waLink("",m))}" target="_blank" rel="noopener">${esc(t("waBtn"))}</a><a class="cta im" href="${esc(imLink("",m))}">${esc(t("imBtn"))}</a><button class="cta alt" data-act="copyText" data-text="${esc(m)}">${esc(t("cpBtn"))}</button></div>
      <details><summary>${esc(t("msgPrev"))}</summary><div class="preview">${esc(m)}</div></details>`); },
  copyText:a=>copy(a.dataset.text),
  incAll:a=>{ G().includeAll=a.getAttribute("aria-checked")!=="true"; persist(); render(); },
  draw:()=>doDraw(),
  addPair:()=>{ const a=$("pa").value, b=$("pb").value; if(!a||!b||a===b){ toast(t("avoidPick")); return; } if(!blocked(a,b)) G().pairs.push([a,b]); if(G().draw){ /* pairs only affect the next draw */ } persist(); render(); },
  delPair:a=>{ G().pairs.splice(+a.dataset.i,1); persist(); render(); },
  redrawQ:()=>confirmSheet(t("dRedoQ"),t("dRedoP"),t("dRedoY"),"redrawY"),
  redrawY:()=>{ G().draw=null; persist(); doDraw(); },
  saveMore:()=>{ const g=G(), v=id=>$(id).value.trim(); if(v("m_g")) g.name=v("m_g"); g.budget=v("m_b"); g.place=v("m_pl"); g.party=$("m_d").value; g.deadline=$("m_dl").value; if(v("m_y")) g.org.name=v("m_y"); g.org.phone=v("m_p");
    if(!g.draw) g.org.plays=$("m_play").getAttribute("aria-checked")==="true"; syncOrganizer(); persist(); render(); toast(t("saved")); cloudRegister(g); },
  backupDl:async()=>{ const txt=backupText(), name=`secret-santa-backup-${(G().name||"group").toLowerCase().replace(/[^a-z0-9]+/g,"-")}.txt`;
    try{ const dl=null; if(dl){ await dl.save({filename:name,data:new Blob([txt],{type:"text/plain"})}); return; } }catch(e){}
    try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }catch(e){ copy(txt); } },
  backupCopy:()=>copy(backupText()),
  restoreOpen:()=>restoreSheet(), restoreGo:()=>restoreFrom($("rsBox").value),
  switch:a=>{ DB.cur=a.dataset.g; view="home"; closeSheet(); persist(); render(); },
  newGroup:()=>{ closeSheet(); newGroup(); wiz=1; render(); },
  delGroupQ:()=>confirmSheet(t("mDeleteQ"),t("mDeleteP"),t("mDeleteY"),"delGroupY"),
  menu:()=>{ menuSheet(); if(G()&&!isPlus()) plusCheck(G().gid,1); }, plusOpen:()=>plusSheet(), buyPlus:()=>buyPlus(), login:a=>loginSheet(a&&a.dataset&&a.dataset.m==="start"?"start":"login"), resendCode:async()=>{ const c=CLOUD(); if(c&&loginEmail){ const r=await c.sendCode(loginEmail); toast(r==="ok"?t("codeT"):r==="rate"?t("tooMany"):t("netFail")); } },
  nudgeX:()=>{ DB.nudgeX=1; persist(); render(); },
  signOut:async()=>{ const c=CLOUD(); if(c){ await c.signOut(); } closeSheet(); render(); toast(t("signedOut")); },
  delGroupY:()=>{ const c=CLOUD(); if(c) c.remove(DB.cur); delete DB.groups[DB.cur]; DB.cur=(Object.values(DB.groups).find(x=>x.setup)||{}).gid||null; persist(); closeSheet(); view="home"; render(); },
};
function refreshAfterAdd(){ if(window.__capHit){ window.__capHit=false; setTimeout(()=>plusSheet("cap"),250); } if($("sheetRoot").innerHTML){ addSheet(); } render(); }
const NEEDACCT=new Set(["qInv","qRem","qPin","qOne","groupLink","draw"]);
document.addEventListener("click",e=>{ const a=e.target.closest("[data-act]"); if(!a) return; const fn=ACT[a.dataset.act]; if(!fn) return;
  if(CLOUD()&&!ME()&&NEEDACCT.has(a.dataset.act)&&G()&&G().setup){ pendingAct={act:a.dataset.act,data:{...a.dataset}}; loginSheet("gate"); return; }
  fn(a,e); });
function wireInputs(){ const f=$("addForm"); if(f) f.onsubmit=e=>{ e.preventDefault(); const n=$("a_n"), p=$("a_p"); const r=addPerson(n.value,p.value); if(r===false) toast(t("dupe",1)); else if(r){ persist(); toast(t("added",1)); }
  n.value=""; p.value=""; if($("sheetRoot").innerHTML){ addSheet(); render(); } else { render(); } setTimeout(()=>$("a_n")&&$("a_n").focus(),50); };
  const an=$("a_n"); if(an) an.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); $("a_p").focus(); } };
  const bc=$("w_bc"); if(bc) bc.oninput=()=>{ document.querySelectorAll("[data-act=bud]").forEach(b=>b.setAttribute("aria-pressed","false")); G().budget=bc.value.trim(); persist(); }; }
addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("sheetRoot").innerHTML) closeSheet(); });

/* ---------- cloud: letters arrive by themselves, the leaderboard is live ---------- */
function ensureKey(g){ if(!g.key){ const a=new Uint8Array(18); crypto.getRandomValues(a); g.key=[...a].map(b=>b.toString(16).padStart(2,"0")).join(""); persist(); } return g.key; }
async function cloudRegister(g){ if(!g||!g.setup) return; try{ const ok=await rpc("register_group",{p_gid:g.gid,p_name:g.name||"",p_key:ensureKey(g)}); g.cloud=ok===true?1:-1; persist(); }catch(e){} }
let pulling=false;
async function cloudPull(show){ const g=G(); if(!g||!g.setup||pulling) return; pulling=true;
  try{ if(g.cloud!==1){ await cloudRegister(g); if(g.cloud!==1){ if(show) toast(t("syncFail")); return; } render(); }
    const rows=await rpc("fetch_letters",{p_gid:g.gid,p_key:g.key,p_after:g.lastL||0});
    if(Array.isArray(rows)&&rows.length){ g.lastL=rows[rows.length-1].id; persist(); const ls=[]; rows.forEach(r=>{ const o=unseal(r.code,"L"); if(o&&o.gid===g.gid&&o.n) ls.push(o); }); if(ls.length) importLetters(ls); }
    const bd=await rpc("get_board",{p_gid:g.gid});
    if(Array.isArray(bd)&&bd.length&&mergeBoard(g,bd.map(r=>[r.player,r.score,r.stars,r.top_level,Date.parse(r.updated_at)||0]))){ persist(); render(); }
    if(show) toast(t("synced"));
  }catch(e){ if(show) toast(t("syncFail")); } finally{ pulling=false; } }
setInterval(()=>{ if(document.visibilityState==="visible") cloudPull(false); },20000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") cloudPull(false); });

/* ---------- start ---------- */
(function boot(){ if(DB.view) view=DB.view; if(DB.cur&&!DB.groups[DB.cur]) DB.cur=null;
  const g=G(); if(g&&!g.setup&&!Object.values(DB.groups).some(x=>x.setup)) wiz=0;
  render();
  const h=decodeURIComponent(location.hash+" "+location.href), ls=findLetters(h), bs=findBoards(h);
  if(ls.length||bs.length){ try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} importAny(h); }
})();
setTimeout(()=>cloudPull(false),600);
setTimeout(()=>{ let pend=null; try{ pend=localStorage.getItem("posada-plus-pending"); }catch(e){} if(!pend||!PLUS.link) return; try{ localStorage.removeItem("posada-plus-pending"); }catch(e){} if(DB.groups[pend]){ DB.cur=pend; view="home"; render(); toast(t("plusWait")); plusCheck(pend,20).then(ok=>{ if(!ok) toast(t("plusLate")); }); } },900);
setTimeout(async()=>{ if(!AUTH.user()) return; if(window.__magic){ await afterLogin(); return; } await AUTH.sync(); if(!G()||!G().setup){ const x=Object.values(DB.groups).filter(g=>g.setup).sort((a,b)=>(b.ut||0)-(a.ut||0))[0]; if(x){ DB.cur=x.gid; wiz=0; view="home"; } } if(!document.activeElement||!/INPUT|TEXTAREA/.test(document.activeElement.tagName)) render(); },0);
addEventListener("hashchange",()=>{ const ls=findLetters(decodeURIComponent(location.hash)); if(ls.length){ try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} importLetters(ls); } });
</script>
