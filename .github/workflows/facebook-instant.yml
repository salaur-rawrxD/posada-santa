name: Facebook Instant Games — Build / Stage

on:
  push:
    branches: [main]
    paths:
      - 'play.html'
      - 'scripts/facebook/**'
      - '.github/workflows/facebook-instant.yml'
  workflow_dispatch:
    inputs:
      upload_to_meta:
        description: 'Stage the built ZIP in Meta Web Hosting (never publishes)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: facebook-instant-upload
  cancel-in-progress: false

jobs:
  package:
    name: Package La Posada
    runs-on: ubuntu-latest
    steps:
      - name: Check out game source
        uses: actions/checkout@v4
      - name: Build Facebook ZIP
        run: python3 scripts/facebook/build_instant.py
      - name: Validate upload package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          path=Path("dist/la-posada-facebook.zip")
          with ZipFile(path) as z:
              assert z.testzip() is None
              assert z.namelist() == ["index.html","fbapp-config.json"], z.namelist()
              html=z.read("index.html").decode("utf-8")
              cfg=json.loads(z.read("fbapp-config.json"))
              assert "FBInstant.initializeAsync()" in html
              assert "SB_KEY=" not in html, "Website Supabase key must not ship"
              assert "posthog.js" not in html
              assert cfg["instant_games"]["orientation"] == "PORTRAIT"
          print("ZIP sanity checks passed")
          PY
      - name: Save bundle as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: la-posada-facebook-instant
          path: dist/la-posada-facebook.zip
          retention-days: 30
          if-no-files-found: error
      - name: Resolve Meta credential securely
        if: ${{ inputs.upload_to_meta }}
        env:
          META_UPLOAD_TOKEN: ${{ secrets.FACEBOOK_ASSET_UPLOAD_TOKEN }}
          META_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          FB_APP_ID: '3530558340439821'
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ.get("META_UPLOAD_TOKEN", "").strip()
          if not token:
              app_secret = os.environ.get("META_APP_SECRET", "").strip()
              if not app_secret:
                  print("::error::Add GitHub Actions secret FACEBOOK_APP_SECRET (or FACEBOOK_ASSET_UPLOAD_TOKEN).")
                  sys.exit(1)
              body = urllib.parse.urlencode({
                  "client_id": os.environ["FB_APP_ID"],
                  "client_secret": app_secret,
                  "grant_type": "client_credentials"
              }).encode()
              try:
                  req = urllib.request.Request(
                      "https://graph.facebook.com/oauth/access_token",
                      data=body, method="POST"
                  )
                  with urllib.request.urlopen(req, timeout=20) as response:
                      result = json.load(response)
                  token = str(result.get("access_token", ""))
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, ValueError):
                  print("::error::Meta app-token generation failed. Check App ID, App Secret, and Meta app settings.")
                  sys.exit(1)
              if not token:
                  print("::error::Meta did not return an app access token.")
                  sys.exit(1)
              print("Generated a temporary app access token for this workflow run.")
          else:
              print("Using the configured Instant Games upload token.")
          print("::add-mask::" + token)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("META_STAGE_TOKEN=" + token + "\n")
          PY
      - name: Upload ZIP to Meta as an unpublished staged asset
        if: ${{ inputs.upload_to_meta }}
        env:
          FB_APP_ID: '3530558340439821'
        run: |
          set -euo pipefail
          # Matches Meta's archived Instant Games uploader: /{app-id}/assets,
          # multipart 'asset' and 'type=BUNDLE'. No publishing step.
          response=$(curl --silent --show-error --fail-with-body \
            --request POST "https://graph-video.facebook.com/${FB_APP_ID}/assets" \
            --form "type=BUNDLE" \
            --form "comment=GitHub Actions staged build ${GITHUB_SHA}" \
            --form "asset=@dist/la-posada-facebook.zip;type=application/zip" \
            --form "access_token=${META_STAGE_TOKEN}")
          META_RESPONSE="$response" python3 - <<'PY'
          import json,os,sys
          result=json.loads(os.environ["META_RESPONSE"])
          if not result.get("success", False):
              print("Meta upload did not confirm success (check the app's Web Hosting page).")
              sys.exit(1)
          print("Meta accepted the ZIP as a staged Instant Games asset. This is NOT published.")
          PY
      - name: Next step
        if: ${{ inputs.upload_to_meta }}
        run: echo "Review the staged build at https://developers.facebook.com/apps/3530558340439821/instant-games/hosting/"
