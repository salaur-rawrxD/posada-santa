<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas Movie Trivia · Posada</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800;9..144,900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#10201a; --bg2:#173025; --card:#1e3a2c; --card2:#24473a; --red:#c8352e; --red2:#e04a3f;
  --gold:#f2c14e; --cream:#fbf3e4; --muted:#9fbbaa; --line:rgba(251,243,228,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#24493a 0%,var(--bg) 55%) fixed;color:var(--cream);
  font-family:Nunito,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;color:inherit}
.hidden{display:none!important}
.snow{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.7;
  background-image:radial-gradient(2px 2px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70% 10%,#fff6 50%,transparent 51%),
  radial-gradient(2px 2px at 40% 80%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 85% 60%,#fff7 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 10% 70%,#fff5 50%,transparent 51%);background-size:320px 320px;animation:fall 40s linear infinite}
@keyframes fall{to{background-position:0 320px}}
.wrap{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:0 2rem}

/* ---------- Top bar ---------- */
.top{position:sticky;top:0;z-index:5;background:linear-gradient(#10201af2,#10201ad9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:1rem;padding-top:.8rem;padding-bottom:.8rem}
.brand{font-family:Fraunces,serif;font-weight:900;font-size:1.45rem;white-space:nowrap}
.brand span{color:var(--gold)}
.scores{display:flex;gap:.5rem;flex:1;justify-content:center;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:.5rem;padding:.35rem .8rem .35rem .45rem;border-radius:999px;background:var(--card);border:2px solid transparent;
  font-weight:800;transition:transform .25s,border-color .25s}
.chip .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.85rem}
.chip .p{font-family:Fraunces,serif;font-weight:900;font-size:1.25rem;color:var(--gold);min-width:1.4ch;text-align:right}
.chip.turn{border-color:var(--gold);transform:scale(1.06)}
.chip.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
.tbtn{background:transparent;border:1px solid var(--line);border-radius:999px;padding:.5rem .95rem;font-weight:800;font-size:.85rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.tbtn:hover{color:var(--cream);border-color:var(--muted)}

/* ---------- Board ---------- */
.hero{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;padding:1.8rem 0 .6rem}
.turnline{font-family:Fraunces,serif;font-weight:800;font-size:clamp(1.6rem,3vw,2.5rem);line-height:1.1}
.who{padding:.05em .35em;border-radius:.3em;color:#1b1206}
.sub{color:var(--muted);font-weight:700;margin-top:.35rem}
.surprise{background:var(--red);border:none;border-radius:18px;padding:1rem 1.4rem;font-weight:900;font-size:1.15rem;cursor:pointer;
  box-shadow:0 6px 0 #7d1d18;display:flex;align-items:center;gap:.6rem;transition:transform .1s}
.surprise:hover{background:var(--red2)}
.surprise:active{transform:translateY(4px);box-shadow:0 2px 0 #7d1d18}
.surprise .die{font-size:1.6rem;display:inline-block}
.surprise:hover .die{animation:roll .6s}
@keyframes roll{to{transform:rotate(360deg)}}
.progress{height:8px;background:#0005;border-radius:99px;overflow:hidden;margin:1rem 0 .4rem}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red2));border-radius:99px;transition:width .5s}

.shelf{margin-top:1.8rem}
.shelf h2{font-family:Fraunces,serif;font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem;color:var(--cream)}
.shelf h2 small{font-family:Nunito;font-weight:800;font-size:.8rem;color:var(--muted);background:var(--card);padding:.15rem .55rem;border-radius:99px}
.shelf h2::after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s,border-color .18s;padding:0}
.card:hover:not(:disabled){transform:translateY(-5px) rotate(-.6deg);box-shadow:0 14px 30px #0008;border-color:var(--gold)}
.card:disabled{cursor:default;filter:grayscale(.85) brightness(.6)}
.card .art{height:96px;position:relative}
.card .art svg{display:block;width:100%;height:100%}
.card .done{position:absolute;inset:0;display:grid;place-items:center;font-size:2.4rem;background:#0006}
.card .body{padding:.7rem .8rem .8rem;display:flex;flex-direction:column;gap:.25rem;flex:1}
.card .t{font-family:Fraunces,serif;font-weight:800;font-size:1.05rem;line-height:1.15}
.card .s{color:var(--muted);font-size:.78rem;font-weight:700}
.card .meter{margin-top:auto;padding-top:.45rem;display:flex;align-items:center;gap:.5rem;font-size:.75rem;font-weight:800;color:var(--gold)}
.card .meter b{flex:1;height:5px;background:#0005;border-radius:9px;overflow:hidden}
.card .meter b i{display:block;height:100%;background:var(--gold)}
.card .x2{position:absolute;top:8px;right:8px;background:var(--gold);color:#3a2a00;font-weight:900;font-size:.7rem;padding:.2rem .45rem;border-radius:6px;box-shadow:0 2px 6px #0007}
.shelf.bonus .card{background:#3a1a1a;border-color:#e04a3f44}

/* ---------- Question ---------- */
#qview{min-height:calc(100vh - 66px);display:flex;flex-direction:column}
.qart{display:flex;flex-direction:column;align-items:center;padding-top:1.4rem}
.qart .frame{height:24vh;min-height:140px;aspect-ratio:2/1;border-radius:22px;overflow:hidden;box-shadow:0 18px 40px #0009;border:2px solid var(--line);animation:rise .4s ease-out}
.qart .frame svg{width:100%;height:100%;display:block}
.qhead{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:-1.1rem;position:relative}
.pill{background:#000a;border:1px solid var(--line);border-radius:999px;padding:.45rem 1rem;font-weight:800;font-size:clamp(.85rem,1.3vw,1.1rem);backdrop-filter:blur(4px)}
.pill.gold{background:var(--gold);color:#3a2a00;border-color:transparent}
.qbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:1.4rem 2rem 2rem;max-width:1300px;margin:0 auto;width:100%}
.forwho{font-weight:800;color:var(--muted);margin-bottom:1rem;font-size:1.05rem}
.forwho b{padding:.1em .45em;border-radius:.35em;color:#1b1206}
.qtext{font-family:Fraunces,serif;font-weight:700;font-size:clamp(1.8rem,4.2vw,3.8rem);line-height:1.18;max-width:30ch;animation:rise .45s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.answer{margin-top:2rem;min-height:5rem;display:flex;align-items:center;justify-content:center}
.ans{font-size:clamp(1.5rem,3.2vw,2.8rem);font-weight:900;color:var(--gold);background:#0005;border:2px dashed var(--gold);border-radius:20px;padding:1rem 2rem;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.btn{border:none;border-radius:16px;padding:1rem 2rem;font-weight:900;font-size:clamp(1.05rem,1.6vw,1.35rem);cursor:pointer;transition:transform .1s}
.btn.reveal{background:var(--red);color:#fff;box-shadow:0 6px 0 #7d1d18;margin-top:1.5rem}
.btn.reveal:hover{background:var(--red2)}
.btn.reveal:active{transform:translateY(4px);box-shadow:0 2px 0 #7d1d18}
.award{margin-top:1.8rem;width:100%;max-width:1000px}
.award h3{font-weight:900;font-size:1.25rem;margin-bottom:.9rem}
.award .teams{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
.tbig{min-width:170px;padding:1rem 1.4rem;border-radius:16px;border:none;font-weight:900;font-size:1.2rem;color:#1b1206;cursor:pointer;
  box-shadow:0 5px 0 #0006;transition:transform .1s}
.tbig:hover{transform:translateY(-3px)}
.tbig:active{transform:translateY(3px);box-shadow:0 1px 0 #0006}
.tbig small{display:block;font-size:.75rem;opacity:.75}
.tbig.none{background:var(--card2);color:var(--cream)}
.qfoot{display:flex;gap:1rem;justify-content:center;margin-top:1.6rem}
.link{background:none;border:none;color:var(--muted);font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--cream)}
.keys{margin-top:1.2rem;color:var(--muted);font-size:.85rem}
kbd{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:.08rem .4rem;font-family:inherit}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;z-index:20;background:#060d0add;backdrop-filter:blur(6px);display:grid;place-items:center;padding:1.5rem}
.panel{background:linear-gradient(160deg,var(--card2),var(--bg2));border:1px solid var(--line);border-radius:24px;padding:2rem;width:min(640px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px #000a}
.panel h2{font-family:Fraunces,serif;font-weight:900;font-size:2rem;text-align:center}
.panel p.lead{color:var(--muted);text-align:center;margin:.4rem 0 1.4rem;font-weight:700}
.trow{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem}
.trow .sw{width:40px;height:40px;border-radius:12px;border:none;cursor:pointer;font-size:1.2rem;flex:none}
.trow input{flex:1;background:#0004;border:1px solid var(--line);border-radius:12px;padding:.75rem .9rem;font:800 1.1rem Nunito;color:var(--cream);outline:none}
.trow input:focus{border-color:var(--gold)}
.trow .rm{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:.3rem}
.trow .adj{display:flex;align-items:center;gap:.3rem}
.trow .adj button{width:32px;height:32px;border-radius:9px;border:none;background:#0004;font-weight:900;cursor:pointer}
.trow .adj span{min-width:2.2ch;text-align:center;font-family:Fraunces,serif;font-weight:900;color:var(--gold);font-size:1.2rem}
.addt{width:100%;background:none;border:1px dashed var(--muted);color:var(--muted);border-radius:12px;padding:.7rem;font-weight:800;cursor:pointer;margin-top:.2rem}
.rules{margin:1.3rem 0 .4rem;display:grid;gap:.45rem;font-weight:700;color:var(--muted);font-size:.95rem}
.rules b{color:var(--cream)}
.panel .go{width:100%;margin-top:1.2rem;background:var(--red);color:#fff;box-shadow:0 6px 0 #7d1d18}
.panel .row2{display:flex;gap:.8rem;margin-top:1rem}
.panel .row2 .btn{flex:1}
.ghost{background:var(--card);border:1px solid var(--line)!important;color:var(--cream)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1rem;margin:1.8rem 0 1rem;min-height:220px}
.pod{width:150px;text-align:center}
.pod .nm{font-weight:900;font-size:1.1rem;margin-bottom:.4rem}
.pod .blk{border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:.7rem;color:#1b1206;font-family:Fraunces,serif;font-weight:900;font-size:1.8rem}
.pod .blk small{font-family:Nunito;font-size:.8rem}
.rest{color:var(--muted);text-align:center;font-weight:700}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:25;background:var(--gold);color:#2a1d00;font-weight:900;font-size:1.3rem;
  padding:.8rem 1.6rem;border-radius:999px;box-shadow:0 10px 30px #0008;animation:toast 1.8s forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (max-width:700px){.wrap{padding:0 1rem}.brand{font-size:1.1rem}.top .wrap{flex-wrap:wrap}.scores{order:3;flex-basis:100%;justify-content:flex-start}.row{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="snow"></div>
<canvas id="confetti"></canvas>

<div class="top"><div class="wrap">
  <div class="brand">🎄 Movie <span>Trivia</span></div>
  <div class="scores" id="scores"></div>
  <button class="tbtn" id="teamsBtn">Teams & Scores</button>
  <button class="tbtn" id="endBtn">Finish 🏆</button>
</div></div>

<main>
  <section id="board" class="wrap">
    <div class="hero">
      <div>
        <div class="turnline" id="turnline"></div>
        <div class="sub" id="subline"></div>
      </div>
      <button class="surprise" id="surpriseBtn"><span class="die">🎲</span> Surprise Me</button>
    </div>
    <div class="progress"><i id="prog"></i></div>
    <div id="shelves"></div>
    <div style="height:3rem"></div>
  </section>

  <section id="qview" class="hidden">
    <div class="qart" id="qart"><div class="qhead" id="qhead"></div></div>
    <div class="qbody">
      <div class="forwho" id="forwho"></div>
      <div class="qtext" id="qtext"></div>
      <div class="answer" id="answer"></div>
      <button class="btn reveal" id="revealBtn">Reveal Answer</button>
      <div class="award hidden" id="award">
        <h3>Who got it right?</h3>
        <div class="teams" id="awardTeams"></div>
      </div>
      <div class="qfoot"><button class="link" id="skipBtn">Skip this question</button></div>
      <div class="keys" id="keys"></div>
    </div>
  </section>
</main>

<!-- Setup / teams -->
<div class="overlay hidden" id="setup"><div class="panel">
  <h2>🎄 Christmas Movie Trivia</h2>
  <p class="lead" id="setupLead">Set up your teams</p>
  <div id="teamRows"></div>
  <button class="addt" id="addTeam">+ Add a team</button>
  <div class="rules" id="rules">
    <div>🎬 <b>Pick a movie</b> on your turn and get a random question from it.</div>
    <div>🗣️ <b>Shout your answer</b>, then reveal and tap the team that got it.</div>
    <div>⭐ <b>Bonus movies</b> are worth double points.</div>
  </div>
  <button class="btn go" id="startBtn">Let's play!</button>
</div></div>

<!-- Finish -->
<div class="overlay hidden" id="finish"><div class="panel">
  <h2>🏆 Final Standings</h2>
  <div class="podium" id="podium"></div>
  <div class="rest" id="rest"></div>
  <div class="row2">
    <button class="btn ghost" id="keepBtn">Keep playing</button>
    <button class="btn go" id="newBtn" style="margin-top:0">New game</button>
  </div>
</div></div>

<script>
// Original tile illustrations (no characters, no studio artwork). viewBox 240x120.
const ART = (() => {
  const sky = (a,b) => `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="240" height="120" fill="url(#g)"/>`;
  const stars = (n, seed=1) => { let s="",x=seed; for(let i=0;i<n;i++){x=(x*9301+49297)%233280; const px=x/233280*240; x=(x*9301+49297)%233280; const py=x/233280*55; s+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${i%3?0.7:1.2}" fill="#fff" opacity=".8"/>`;} return s; };
  const snowGround = (y=100,c="#e9f1ec") => `<path d="M0 ${y} Q60 ${y-6} 120 ${y} T240 ${y} V120 H0Z" fill="${c}"/>`;
  const lights = (x1,x2,y,sag=5,n=10) => { let s=`<path d="M${x1} ${y} Q${(x1+x2)/2} ${y+sag*2} ${x2} ${y}" stroke="#2a3b31" stroke-width=".8" fill="none"/>`; const cols=["#f2c14e","#e04a3f","#5ec27a","#6fb7ff"]; for(let i=1;i<n;i++){const t=i/n, x=x1+(x2-x1)*t, yy=y+sag*2*2*t*(1-t); s+=`<circle cx="${x.toFixed(1)}" cy="${(yy+2).toFixed(1)}" r="1.8" fill="${cols[i%4]}"/>`;} return s; };
  const house = (x,y,w,h,body,roof,win="#f7d774") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${body}"/><path d="M${x-4} ${y} L${x+w/2} ${y-h*0.6} L${x+w+4} ${y}Z" fill="${roof}"/><rect x="${x+w*0.18}" y="${y+h*0.25}" width="${w*0.22}" height="${h*0.25}" fill="${win}"/><rect x="${x+w*0.6}" y="${y+h*0.25}" width="${w*0.22}" height="${h*0.25}" fill="${win}"/><rect x="${x+w*0.4}" y="${y+h*0.55}" width="${w*0.2}" height="${h*0.45}" fill="#5a2b1f"/>`;
  const svg = inner => `<svg viewBox="0 0 240 120" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  const raw = {
    four: svg(sky("#3b5f8a","#9db6c9") + `<rect width="240" height="70" fill="#dfe6ea" opacity=".35"/>
      <g fill="#fff" opacity=".85"><path d="M150 28 l30 -4 l4 3 l-30 5z"/><path d="M162 25 l-6 -8 l4 0 l9 7z"/><path d="M164 29 l-4 7 l4 0 l7 -6z"/></g>
      ${house(14,70,40,30,"#c8352e","#7d1d18")}${house(70,72,40,28,"#2f7a4f","#1b4a30")}${house(126,70,40,30,"#f2c14e","#a37a17")}${house(182,72,40,28,"#6b8fd6","#3a5a9a")}
      <g fill="#2f7a4f">${[34,90,146,202].map(x=>`<circle cx="${x}" cy="62" r="5" fill="none" stroke="#2f7a4f" stroke-width="3"/><circle cx="${x}" cy="67" r="1.5" fill="#e04a3f"/>`).join("")}</g>${snowGround(100)}`),
    kranks: svg(sky("#1a2a4a","#3d5a80") + stars(20,3) + `<circle cx="205" cy="22" r="11" fill="#fdf3d0"/>
      ${house(40,62,110,40,"#8a6d5a","#4a3a30")}
      <g transform="translate(92 22)"><circle cx="0" cy="10" r="9" fill="#fff"/><circle cx="0" cy="-3" r="6.5" fill="#fff"/><rect x="-6" y="-14" width="12" height="3" fill="#222"/><rect x="-4" y="-22" width="8" height="9" fill="#222"/><path d="M0 -3 l7 1.5 l-7 1z" fill="#f28c28"/></g>
      ${lights(36,154,62,3,14)}
      <g transform="translate(190 64)"><rect x="-2" y="0" width="4" height="36" fill="#7a5230"/><path d="M0 0 q-18 -6 -24 4 M0 0 q18 -6 24 4 M0 0 q-10 -14 -20 -10 M0 0 q10 -14 20 -10" stroke="#3fa45f" stroke-width="5" fill="none" stroke-linecap="round"/></g>${snowGround(102)}`),
    deck: svg(sky("#0d1530","#1f2f5a") + stars(30,7) + `<path d="M150 0 L120 64 L180 64Z" fill="#f2c14e" opacity=".18"/>
      <g transform="translate(170 18) rotate(-20)"><rect x="-6" y="-4" width="12" height="8" fill="#aab"/><rect x="-22" y="-2" width="14" height="4" fill="#6fb7ff"/><rect x="8" y="-2" width="14" height="4" fill="#6fb7ff"/></g>
      ${house(20,66,70,34,"#4a5568","#2d3748","#3b4a5e")}${house(124,64,80,36,"#6b4f3a","#3e2c20")}
      ${lights(120,208,64,2,12)}${lights(124,204,78,3,12)}${lights(124,204,92,3,12)}${lights(118,210,40,-6,12)}${snowGround(100)}`),
    elf: svg(sky("#16324f","#5b86a8") + `<g fill="#0f2238">
      <rect x="10" y="56" width="26" height="46"/><rect x="40" y="44" width="22" height="58"/><rect x="66" y="62" width="20" height="40"/>
      <rect x="98" y="34" width="34" height="68"/><rect x="104" y="22" width="22" height="14"/><rect x="109" y="12" width="12" height="12"/><rect x="114" y="0" width="2" height="14"/>
      <rect x="140" y="50" width="26" height="52"/><rect x="170" y="60" width="24" height="42"/><rect x="198" y="46" width="30" height="56"/></g>
      <g fill="#f7d774" opacity=".8">${Array.from({length:22},(_,i)=>`<rect x="${14+((i*37)%210)}" y="${60+((i*23)%36)}" width="3" height="3"/>`).join("")}</g>

const SHELVES = [
  { name:"Timeless Classics", icon:"📜", ids:["carol","story","miracle","polar","grinch","santa"] },
  { name:"Family Comedies", icon:"😂", ids:["elf","homealone","jingle","kranks","deck","four","noelle"] },
  { name:"Feel-Good Favorites", icon:"✨", ids:["friday","lastholiday"] },
  { name:"Bonus Round", icon:"⭐", ids:["vacation","meangirls"], bonus:true },
];
const COLORS = ["#f2c14e","#ff7b6b","#6fd3a0","#7fb8ff","#d59bff","#ffb26b","#ff8fc7","#9be06b"];
const ICONS  = ["⭐","🎁","🦌","⛄","🔔","🍪","🧦","🎄"];
const KEY = "posada-trivia-v2";
const byId = Object.fromEntries(MOVIES.map(m => [m.id, m]));
MOVIES.forEach(m => { if (!SHELVES.some(s => s.ids.includes(m.id))) SHELVES[1].ids.push(m.id); });

let state = load() || fresh();
let current = null, revealed = false;

function fresh(teams){ return { started:false, used:{}, turn:0, teams: teams || [mk(0,"Team 1"), mk(1,"Team 2")] }; }
function mk(i, n){ return { n, p:0, c:i % COLORS.length }; }
function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const used = id => state.used[id] || (state.used[id] = []);
const left = m => m.qs.length - used(m.id).length;
const pts = m => m.bonus ? 2 : 1;
const team = () => state.teams[state.turn % state.teams.length];
const tag = (t, cls="who") => `<span class="${cls}" style="background:${COLORS[t.c]}">${ICONS[t.c]} ${esc(t.n)}</span>`;
const total = MOVIES.reduce((a,m)=>a+m.qs.length,0);

/* ---------- Scores ---------- */
function renderScores(bump){
  const lead = Math.max(...state.teams.map(t=>t.p));
  $("scores").innerHTML = state.teams.map((t,i)=>`
    <div class="chip ${i===state.turn%state.teams.length?"turn":""} ${bump===i?"bump":""}">
      <span class="dot" style="background:${COLORS[t.c]}">${lead>0&&t.p===lead?"👑":ICONS[t.c]}</span>${esc(t.n)}<span class="p">${t.p}</span>
    </div>`).join("");
}

/* ---------- Board ---------- */
function renderBoard(){
  const t = team();
  $("turnline").innerHTML = `${tag(t)}'s turn`;
  const usedN = total - MOVIES.reduce((a,m)=>a+left(m),0);
  $("subline").textContent = usedN === total ? "Every question has been played. Hit Finish to crown the winner!" : "Pick a movie, or let fate decide.";
  $("prog").style.width = (usedN/total*100)+"%";
  $("surpriseBtn").disabled = usedN === total;
  $("shelves").innerHTML = SHELVES.map(s => {
    const ms = s.ids.map(id=>byId[id]).filter(Boolean);
    if (!ms.length) return "";
    return `<div class="shelf ${s.bonus?"bonus":""}"><h2>${s.icon} ${s.name}${s.bonus?" <small>double points</small>":""}</h2><div class="row">${
      ms.map(m => { const l = left(m), pct = l/m.qs.length*100; return `
        <button class="card" data-id="${m.id}" ${l?"":"disabled"}>
          <div class="art">${ART[m.id]||""}${l?"":'<div class="done">✓</div>'}${m.bonus?'<span class="x2">×2</span>':""}</div>
          <div class="body"><div class="t">${esc(m.title)}</div><div class="s">${esc(m.sub)}</div>
          <div class="meter"><b><i style="width:${pct}%"></i></b>${l} left</div></div>
        </button>`; }).join("")}</div></div>`;
  }).join("");
  document.querySelectorAll(".card[data-id]").forEach(b => b.onclick = () => pick(byId[b.dataset.id]));
  renderScores();
}

/* ---------- Question ---------- */
function pick(m){
  if (!m || !left(m)) return;
  const u = used(m.id);
  const pool = m.qs.map((_,i)=>i).filter(i=>!u.includes(i));
  const i = pool[Math.floor(Math.random()*pool.length)];
  current = { m, i, q:m.qs[i] }; revealed = false;
  $("qart").innerHTML = `<div class="frame">${(ART[m.id]||"").replaceAll(`g-${m.id}`, `q-${m.id}`)}</div><div class="qhead">
    <span class="pill gold">${m.emoji} ${esc(m.title)}</span>${current.q.t?`<span class="pill">${esc(current.q.t)}</span>`:""}
    <span class="pill">${esc(current.q.c)}</span>${m.bonus?`<span class="pill">⭐ Worth 2 points</span>`:""}</div>`;
  $("forwho").innerHTML = `Question for ${tag(team(),"who")}`;
  $("qtext").textContent = current.q.q;
  $("qtext").style.animation="none"; void $("qtext").offsetWidth; $("qtext").style.animation="";
  $("answer").innerHTML = "";
  $("revealBtn").classList.remove("hidden");
  $("award").classList.add("hidden");
  $("skipBtn").textContent = "Skip this question";
  $("keys").innerHTML = `<kbd>Space</kbd> reveal · <kbd>Esc</kbd> back`;
  show("qview");
}
function reveal(){
  if (!current || revealed) return;
  revealed = true;
  $("answer").innerHTML = `<div class="ans">${esc(current.q.a)}</div>`;
  $("revealBtn").classList.add("hidden");
  $("awardTeams").innerHTML = state.teams.map((t,i)=>`<button class="tbig" data-i="${i}" style="background:${COLORS[t.c]}">${ICONS[t.c]} ${esc(t.n)}<small>+${pts(current.m)} point${pts(current.m)>1?"s":""}</small></button>`).join("")
    + `<button class="tbig none" data-i="-1">Nobody 😅<small>no points</small></button>`;
  $("awardTeams").querySelectorAll("button").forEach(b => b.onclick = () => award(+b.dataset.i));
  $("award").classList.remove("hidden");
  $("skipBtn").textContent = "Back without scoring";
  $("keys").innerHTML = state.teams.slice(0,9).map((t,i)=>`<kbd>${i+1}</kbd> ${esc(t.n)}`).join(" · ") + ` · <kbd>0</kbd> nobody`;
}
function award(i){
  if (!current) return;
  used(current.m.id).push(current.i);
  if (i >= 0) {
    state.teams[i].p += pts(current.m);
    toast(`${ICONS[state.teams[i].c]} ${state.teams[i].n} +${pts(current.m)}!`);
    confetti(COLORS[state.teams[i].c]);
  }
  state.turn = (state.turn + 1) % state.teams.length;
  save(); current = null; show("board"); renderScores(i >= 0 ? i : undefined);
}
function skip(){
  // Skipping before the reveal returns the question to the pool; after the reveal it's spent.
  if (current && revealed) used(current.m.id).push(current.i);
  save(); current = null; show("board");
}
function show(v){
  $("board").classList.toggle("hidden", v!=="board");
  $("qview").classList.toggle("hidden", v!=="qview");
  if (v==="board") renderBoard();
  window.scrollTo({top:0});
}

/* ---------- Teams panel ---------- */
function openSetup(){
  $("setupLead").textContent = state.started ? "Rename teams, change colors, or fix a score" : "Name your teams, then let's play";
  $("rules").classList.toggle("hidden", state.started);
  $("startBtn").textContent = state.started ? "Back to the game" : "Let's play!";
  renderTeamRows(); $("setup").classList.remove("hidden");
}
function renderTeamRows(){
  $("teamRows").innerHTML = state.teams.map((t,i)=>`
    <div class="trow">
      <button class="sw" data-i="${i}" style="background:${COLORS[t.c]}" title="Change color">${ICONS[t.c]}</button>
      <input data-i="${i}" value="${esc(t.n)}" maxlength="22">
      ${state.started?`<div class="adj"><button data-d="-1" data-i="${i}">−</button><span>${t.p}</span><button data-d="1" data-i="${i}">+</button></div>`:""}
      ${state.teams.length>2?`<button class="rm" data-i="${i}" title="Remove">✕</button>`:""}
    </div>`).join("");
  $("teamRows").querySelectorAll("input").forEach(el => el.oninput = () => { state.teams[+el.dataset.i].n = el.value.trim() || `Team ${+el.dataset.i+1}`; save(); renderScores(); });
  $("teamRows").querySelectorAll(".sw").forEach(el => el.onclick = () => { const t = state.teams[+el.dataset.i]; t.c = (t.c+1)%COLORS.length; save(); renderTeamRows(); renderScores(); });
  $("teamRows").querySelectorAll(".rm").forEach(el => el.onclick = () => { state.teams.splice(+el.dataset.i,1); state.turn %= state.teams.length; save(); renderTeamRows(); renderScores(); });
  $("teamRows").querySelectorAll(".adj button").forEach(el => el.onclick = () => { state.teams[+el.dataset.i].p += +el.dataset.d; save(); renderTeamRows(); renderScores(); });
}
$("addTeam").onclick = () => { if (state.teams.length >= 8) return; const i = state.teams.length; state.teams.push(mk(i, `Team ${i+1}`)); save(); renderTeamRows(); renderScores(); };
$("startBtn").onclick = () => { state.started = true; save(); $("setup").classList.add("hidden"); show(current ? "qview" : "board"); };
$("teamsBtn").onclick = openSetup;

/* ---------- Finish ---------- */
$("endBtn").onclick = () => {
  const r = [...state.teams].sort((a,b)=>b.p-a.p);
  const order = [r[1], r[0], r[2]], h = [150, 210, 110], medal = ["🥈","🥇","🥉"];
  $("podium").innerHTML = order.map((t,k)=> t ? `<div class="pod"><div class="nm">${medal[k]} ${esc(t.n)}</div>
    <div class="blk" style="height:${h[k]}px;background:${COLORS[t.c]}">${t.p}<small>points</small></div></div>` : "").join("");
  $("rest").innerHTML = r.slice(3).map((t,i)=>`${i+4}. ${esc(t.n)} — ${t.p}`).join(" · ");
  $("finish").classList.remove("hidden");
  if (r[0] && r[0].p > 0) { confetti(COLORS[r[0].c], 260); setTimeout(()=>confetti("#f2c14e",200),400); }
};
$("keepBtn").onclick = () => $("finish").classList.add("hidden");
$("newBtn").onclick = () => {
  state = fresh(state.teams.map(t => ({...t, p:0}))); save();
  $("finish").classList.add("hidden"); current = null; show("board"); openSetup();
};

/* ---------- Fun bits ---------- */
function toast(msg){ const d=document.createElement("div"); d.className="toast"; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),1900); }
const cv=$("confetti"), cx=cv.getContext("2d"); let parts=[], raf=null;
function confetti(color, n=140){
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=[color,"#f2c14e","#fbf3e4","#e04a3f","#6fd3a0"];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.6,y:-20-Math.random()*innerHeight*.3,vx:(Math.random()-.5)*6,vy:Math.random()*3+2,
    r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[i%cols.length]});
  if(!raf) tick();
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();});
  parts=parts.filter(p=>p.y<cv.height+30);
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0,0,cv.width,cv.height), null);
}

/* ---------- Controls ---------- */
$("surpriseBtn").onclick = () => {
  const open = MOVIES.filter(m=>left(m)>0); if (!open.length) return;
  const cards = [...document.querySelectorAll(".card:not(:disabled)")]; let k = 0;
  const target = open[Math.floor(Math.random()*open.length)];
  const spin = setInterval(()=>{ cards.forEach(c=>c.style.borderColor=""); const c=cards[k++%cards.length]; c.style.borderColor="#f2c14e"; }, 70);
  setTimeout(()=>{ clearInterval(spin); pick(target); }, 900);
};
$("revealBtn").onclick = reveal;
$("skipBtn").onclick = skip;
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || !$("setup").classList.contains("hidden")) return;
  if (!current) return;
  if (e.code === "Space") { e.preventDefault(); reveal(); }
  else if (e.key === "Escape") skip();
  else if (revealed && /^[0-9]$/.test(e.key)) { const n=+e.key; if (n===0) award(-1); else if (n<=state.teams.length) award(n-1); }
});

renderBoard();
if (!state.started) openSetup();
</script>
</body>
</html>
