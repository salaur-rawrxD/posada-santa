<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas Movie Trivia · Posada</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#13231b;--bg2:#1b3326;--card:#21402f;--card2:#285039;--red:#c8352e;--red2:#e04a3f;--gold:#f2c14e;--cream:#fbf3e4;--muted:#a9c2b2;
  --line:rgba(251,243,228,.13);--glass:rgba(251,243,228,.06);--glass2:rgba(251,243,228,.11)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#24493a 0%,var(--bg) 60%) fixed;color:var(--cream);font-family:Nunito,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;color:inherit}
.hidden{display:none!important}
.snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;transition:opacity .6s}
body.q-mode .snow{opacity:.45}
body.q-mode .snow i{width:2.5px!important;height:2.5px!important;filter:none!important;box-shadow:none}
#qview{position:relative;z-index:1}
.snow i{position:absolute;top:-20px;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.6);animation:snowfall linear infinite}
@keyframes snowfall{0%{transform:translate(0,-20px)}50%{transform:translate(var(--sway),50vh)}100%{transform:translate(0,105vh)}}
.wrap{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:0 2rem}
.serif{font-family:Fraunces,Georgia,serif}

/* top */
.top{position:sticky;top:0;z-index:5;background:rgba(19,35,27,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:1rem;height:64px}
.brand{background:none;border:none;cursor:pointer;color:var(--cream);transition:transform .2s;font-family:Fraunces,Georgia,serif;font-weight:800;font-size:1.45rem;white-space:nowrap}
.brand span{color:var(--gold)}
.brand:hover{transform:scale(1.05)}
.scores{display:flex;gap:.5rem;flex:1;justify-content:center;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:.5rem;padding:.28rem .85rem .28rem .3rem;border-radius:999px;background:var(--card);border:2px solid transparent;font-weight:800;transition:transform .25s,border-color .25s,box-shadow .25s}
.chip .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.9rem}
.chip .p{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:1.25rem;color:var(--gold);min-width:1.3ch;text-align:right}
.chip.turn{border-color:var(--gold);box-shadow:0 0 20px rgba(242,193,78,.35);transform:scale(1.06)}
.chip.bump{animation:bump .6s}
@keyframes bump{40%{transform:scale(1.3)}}
.tbtn{background:transparent;border:1px solid var(--line);border-radius:999px;padding:.5rem 1rem;font-weight:800;font-size:.85rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.tbtn:hover{color:var(--cream);border-color:var(--muted)}

/* board */
.hero{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;padding:1.1rem 0 .2rem}
.turnline{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(1.8rem,3.4vw,3rem);line-height:1.05}
.who{display:inline-block;padding:.02em .38em;border-radius:.35em;color:#1b1206}
.sub{color:var(--muted);font-weight:700;margin-top:.45rem;font-size:1.02rem}
.surprise{border:none;border-radius:999px;padding:.95rem 1.6rem;font-weight:900;font-size:1.15rem;cursor:pointer;color:#fff;background:var(--red);
  box-shadow:0 6px 0 #7d1d18,0 10px 30px rgba(200,53,46,.35);display:flex;align-items:center;gap:.6rem;transition:transform .15s}
.surprise:hover{background:var(--red2);transform:translateY(-2px) scale(1.04)}
.surprise:active{transform:translateY(4px);box-shadow:0 2px 0 #7d1d18}
.surprise .die{font-size:1.5rem;display:inline-block}
.surprise:hover .die{animation:roll .6s}
@keyframes roll{to{transform:rotate(360deg)}}
.progress{height:7px;background:#0005;border-radius:99px;overflow:hidden;margin:.9rem 0 1rem}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red2));border-radius:99px;transition:width .6s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:.85rem;padding-bottom:1.5rem}
.card{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:flex-start;padding:1rem;border-radius:20px;cursor:pointer;text-align:left;color:var(--cream);
  background:linear-gradient(160deg,var(--card),var(--bg2));border:2px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.25);
  transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,border-color .2s}
.card:hover:not(:disabled){transform:translateY(-6px) scale(1.04) rotate(-1deg);border-color:var(--gold);box-shadow:0 16px 36px rgba(0,0,0,.45),0 0 28px rgba(242,193,78,.25)}
.card:active:not(:disabled){transform:scale(.95)}
.card.flash{transform:scale(1.07);border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 0 36px rgba(242,193,78,.5)}
.card.picked{animation:picked .5s ease-in forwards;background:var(--gold);color:#2a1d00;border-color:#fff}
.card.picked .s,.card.picked .n{color:#5a4410}
@keyframes picked{35%{transform:scale(1.14) rotate(2deg)}100%{transform:scale(1.06)}}
.card:disabled{cursor:default;opacity:.3;filter:grayscale(.8)}
.card .em{font-size:2.3rem;line-height:1;transition:transform .3s}
.card:hover:not(:disabled) .em{transform:scale(1.2) rotate(-8deg)}
.card .t{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:1.12rem;line-height:1.15;margin-top:.6rem}
.card .s{color:var(--muted);font-size:.78rem;font-weight:700;margin-top:.2rem}
.card .n{margin-top:auto;font-weight:900;font-size:.82rem;color:var(--gold)}
.card.bonus{background:linear-gradient(160deg,#4a1d1a,#2a1412);border-color:#e04a3f66}
.card .x2{position:absolute;top:10px;right:10px;background:var(--gold);color:#3a2a00;font-weight:900;font-size:.7rem;padding:.2rem .5rem;border-radius:7px}

/* question — sized to always fit one screen */
#qview{height:calc(100dvh - 65px);display:flex;flex-direction:column;overflow:hidden}
.qart{display:flex;justify-content:center;padding-top:2.2vh}
.qhead{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.35rem .95rem;font-weight:800;font-size:clamp(.8rem,1.8vh,1.05rem)}
.pill.gold{background:var(--gold);color:#3a2a00;border-color:transparent}
.qbody{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.2vh 2rem 2.5vh;max-width:1250px;margin:0 auto;width:100%}
.forwho{font-weight:800;color:var(--muted);margin-bottom:1.4vh;font-size:clamp(.85rem,1.9vh,1.05rem)}
.qcard{width:100%;border-radius:28px;padding:clamp(1rem,3.2vh,2.6rem) clamp(1.2rem,3vw,3rem);background:rgba(0,0,0,.18);border:2px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.35);
  animation:rise .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}
.qtext{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(1.3rem,min(4vw,5.6vh),3.5rem);line-height:1.16}
.answer:empty{display:none}
.answer{margin-top:clamp(.6rem,2.2vh,1.6rem);display:flex;justify-content:center;perspective:900px}
.ans{font-size:clamp(1.1rem,min(3vw,4.2vh),2.5rem);font-weight:900;color:var(--gold);background:#0005;border:2px dashed var(--gold);border-radius:20px;padding:clamp(.5rem,1.6vh,1rem) 1.8rem;
  animation:flip .6s cubic-bezier(.2,1.2,.4,1)}
@keyframes flip{from{transform:rotateX(90deg);opacity:0}}
.btn{border:none;border-radius:999px;padding:clamp(.7rem,1.8vh,1rem) 2.1rem;font-weight:900;font-size:clamp(1rem,2.2vh,1.3rem);cursor:pointer;transition:transform .15s}
.btn.reveal{margin-top:3vh;color:#fff;background:var(--red);box-shadow:0 6px 0 #7d1d18}
.btn.reveal:hover{background:var(--red2);transform:scale(1.04)}
.btn.reveal:active{transform:translateY(4px);box-shadow:0 2px 0 #7d1d18}
.award{margin-top:2.4vh;width:100%}
.award h3{font-weight:900;font-size:clamp(1rem,2.4vh,1.3rem);margin-bottom:1.4vh}
.award .teams{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
.tbig{position:relative;min-width:150px;padding:clamp(.5rem,1.5vh,.95rem) 1.3rem;border-radius:18px;border:none;font-weight:900;font-size:clamp(.95rem,2.2vh,1.15rem);color:#1b1206;cursor:pointer;
  opacity:.6;transform:scale(.96);transition:all .2s cubic-bezier(.3,1.6,.5,1)}
.tbig:hover{opacity:.85}
.tbig small{display:block;font-size:.72rem;opacity:.75}
.tbig.on{opacity:1;transform:scale(1.06);box-shadow:0 0 0 4px #fff,0 10px 30px rgba(0,0,0,.4)}
.tbig.on::after{content:"✓";position:absolute;top:-11px;right:-11px;width:28px;height:28px;border-radius:50%;background:#fff;color:#1b1206;display:grid;place-items:center;font-size:.95rem;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.done{margin-top:2.2vh;color:#fff;background:#2f7a4f;box-shadow:0 6px 0 #1b4a30;min-width:280px}
.done:hover{background:#38905d;transform:scale(1.03)}
.done:active{transform:translateY(4px);box-shadow:0 2px 0 #1b4a30}
.qfoot{display:flex;justify-content:center;margin-top:1.6vh}
.link{background:none;border:none;color:var(--muted);font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:.9rem}
.link:hover{color:var(--cream)}
.keys{margin-top:1vh;color:var(--muted);font-size:.8rem}
@media (max-height:760px){.keys{display:none}}
kbd{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:.04rem .38rem;font-family:inherit}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(6,13,10,.82);backdrop-filter:blur(8px);display:grid;place-items:center;padding:1.5rem}
.panel{background:linear-gradient(160deg,var(--card2),var(--bg2));border:1px solid var(--line);border-radius:26px;padding:2rem;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:rise .45s cubic-bezier(.2,1.3,.4,1)}
.panel h2{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:2rem;text-align:center}
.panel p.lead{color:var(--muted);text-align:center;margin:.4rem 0 1.4rem;font-weight:700}
.trow{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem}
.trow .sw{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;font-size:1.25rem;flex:none;transition:transform .2s}
.trow .sw:hover{transform:rotate(-12deg) scale(1.1)}
.trow input{flex:1;background:#0004;border:1px solid var(--line);border-radius:999px;padding:.75rem 1.1rem;font:800 1.08rem Nunito,sans-serif;color:var(--cream);outline:none}
.trow input:focus{border-color:var(--gold)}
.trow .rm{background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:.3rem}
.trow .adj{display:flex;align-items:center;gap:.3rem}
.trow .adj button{width:32px;height:32px;border-radius:50%;border:none;background:#0004;font-weight:900;cursor:pointer}
.trow .adj span{min-width:2.2ch;text-align:center;font-family:Fraunces,Georgia,serif;font-weight:800;color:var(--gold);font-size:1.2rem}
.addt{width:100%;background:none;border:1.5px dashed var(--muted);color:var(--muted);border-radius:999px;padding:.7rem;font-weight:800;cursor:pointer}
.rules{margin:1.3rem 0 .4rem;display:grid;gap:.45rem;font-weight:700;color:var(--muted);font-size:.95rem}
.rules b{color:var(--cream)}
.panel .go{width:100%;margin-top:1.2rem;background:var(--red);color:#fff;box-shadow:0 6px 0 #7d1d18}
.panel .go:hover{background:var(--red2)}
.panel .row2{display:flex;gap:.8rem;margin-top:1rem}
.panel .row2 .btn{flex:1}
.ghost{background:var(--card);border:1px solid var(--line)!important;color:var(--cream)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1rem;margin:1.8rem 0 1rem;min-height:220px}
.pod{width:150px;text-align:center}
.pod .nm{font-weight:900;font-size:1.1rem;margin-bottom:.4rem}
.pod .blk{border-radius:16px 16px 4px 4px;display:flex;flex-direction:column;align-items:center;padding-top:.7rem;color:#1b1206;font-family:Fraunces,Georgia,serif;font-weight:800;font-size:1.9rem;animation:grow .8s cubic-bezier(.2,1.2,.4,1);transform-origin:bottom}
.pod .blk small{font-family:Nunito,sans-serif;font-size:.8rem}
@keyframes grow{from{transform:scaleY(0)}}
.rest{color:var(--muted);text-align:center;font-weight:700}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);z-index:25;background:var(--gold);color:#2a1d00;font-weight:900;font-size:1.25rem;padding:.75rem 1.6rem;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toast 1.9s forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px) scale(.9)}12%,80%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0}}
@media (max-width:700px){.wrap{padding:0 1rem}.top .wrap{flex-wrap:wrap;height:auto;padding-top:.6rem;padding-bottom:.6rem}.scores{order:3;flex-basis:100%;justify-content:flex-start}.grid{grid-template-columns:repeat(2,1fr)}#qview{height:auto;min-height:calc(100dvh - 64px)}}

/* wheel */
.wpanel{width:min(720px,100%);text-align:center}
.wheelbox{position:relative;width:min(48vh,440px,80vw);aspect-ratio:1;margin:1rem auto .6rem}
.wheelbox svg{width:100%;height:100%;display:block;filter:drop-shadow(0 14px 30px rgba(0,0,0,.5))}
.pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid var(--gold);z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.pointer.wiggle{animation:wig .12s}
@keyframes wig{50%{transform:translateX(-50%) rotate(-14deg)}}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26%;aspect-ratio:1;border-radius:50%;border:5px solid var(--cream);background:var(--red);color:#fff;
  font:900 clamp(1rem,2.6vh,1.4rem) Nunito,sans-serif;cursor:pointer;box-shadow:0 6px 0 #7d1d18,0 10px 30px rgba(0,0,0,.5);transition:transform .15s}
.hub:hover:not(:disabled){transform:translate(-50%,-50%) scale(1.07)}
.hub:disabled{cursor:default;background:#7d1d18}
.wres{min-height:3.4rem;font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(1.4rem,3.6vh,2.2rem);color:var(--gold)}
.wres span{display:inline-block;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.kid{display:flex;gap:.5rem;align-items:center;justify-content:center;color:var(--muted);font-weight:800;font-size:.9rem;cursor:pointer;margin-top:.4rem}
.kid input{width:20px;height:20px;accent-color:var(--gold)}
.queue{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin-top:.5rem}
.queue span{flex:none;padding:.2rem .7rem;border-radius:99px;font-weight:800;font-size:.85rem;color:#1b1206;opacity:.45}
.queue span.now{opacity:1;box-shadow:0 0 0 3px #fff}
.queue span.past{opacity:.25;text-decoration:line-through}
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<canvas id="confetti"></canvas>

<div class="top"><div class="wrap">
  <button class="brand" id="homeBtn" title="Back to the movies">🎄 Movie <span>Trivia</span></button>
  <div class="scores" id="scores"></div>
  <button class="tbtn" id="muteBtn" title="Sound on/off">🔊</button>
  <button class="tbtn" id="teamsBtn">Teams & Scores</button>
  <button class="tbtn" id="wheelBtn" title="Spin the drink wheel">🎡 Wheel</button>
  <button class="tbtn" id="endBtn">Finish 🏆</button>
</div></div>

<main>
  <section id="board" class="wrap">
    <div class="hero">
      <div>
        <div class="turnline" id="turnline"></div>
        <div class="sub" id="subline"></div>
      </div>
      <button class="surprise" id="surpriseBtn"><span class="die">🎲</span> Surprise Me</button>
    </div>
    <div class="progress"><i id="prog"></i></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="qview" class="hidden">
    <div class="qart" id="qart"><div class="qhead" id="qhead"></div></div>
    <div class="qbody">
      <div class="forwho" id="forwho"></div>
      <div class="qcard" id="qcard">
        <div class="qtext" id="qtext"></div>
        <div class="answer" id="answer"></div>
      </div>
      <button class="btn reveal" id="revealBtn">Reveal Answer</button>
      <div class="award hidden" id="award">
        <h3>Who got it right? <span style="color:var(--muted);font-weight:700;font-size:.95rem">Tap every team that did</span></h3>
        <div class="teams" id="awardTeams"></div>
        <button class="btn done" id="doneBtn">Nobody got it — next turn</button>
      </div>
      <div class="qfoot"><button class="link" id="skipBtn">Skip this question</button></div>
      <div class="keys" id="keys"></div>
    </div>
  </section>
</main>

<!-- Setup / teams -->
<div class="overlay hidden" id="setup"><div class="panel">
  <h2>🎄 Christmas Movie Trivia</h2>
  <p class="lead" id="setupLead">Set up your teams</p>
  <div id="teamRows"></div>
  <button class="addt" id="addTeam">+ Add a team</button>
  <div class="rules" id="rules">
    <div>🎬 <b>Pick a movie</b> on your turn and get a random question from it.</div>
    <div>🗣️ <b>Shout your answer</b>, then reveal and tap the team that got it.</div>
    <div>⭐ <b>Bonus movies</b> are worth double points.</div>
  </div>
  <button class="btn go" id="startBtn">Let's play!</button>
</div></div>

<!-- Wheel -->
<div class="overlay hidden" id="wheelOv"><div class="panel wpanel">
  <h2>🎡 Wheel of Misfortune</h2>
  <p class="lead" id="wheelWho"></p>
  <div class="queue" id="wheelQueue"></div>
  <div class="wheelbox"><div class="pointer" id="pointer"></div><svg id="wheel" viewBox="-120 -120 240 240"></svg><button class="hub" id="spinBtn">SPIN</button></div>
  <div class="wres" id="wres"></div>
  <label class="kid"><input type="checkbox" id="kidSafe"> 🧃 No-alcohol spin (swaps the shot for pickle juice)</label>
  <div class="row2"><button class="btn go" id="wheelClose" style="margin-top:0">Done</button></div>
</div></div>

<!-- Finish -->
<div class="overlay hidden" id="finish"><div class="panel">
  <h2>🏆 Final Standings</h2>
  <div class="podium" id="podium"></div>
  <div class="rest" id="rest"></div>
  <div class="row2">
    <button class="btn ghost" id="keepBtn">Keep playing</button>
    <button class="btn ghost" id="podWheel">🎡 Spin the wheel</button>
    <button class="btn go" id="newBtn" style="margin-top:0">New game</button>
  </div>
</div></div>

<script>
/* ---------- Sound effects (synthesized live with Web Audio — no files) ---------- */
const Sfx = (() => {
  let ctx = null, master = null, muted = false, lastHover = 0;
  try { muted = localStorage.getItem("trivia-muted") === "1"; } catch(e){}
  function ac(){
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      ctx = new C(); master = ctx.createGain(); master.gain.value = 0.55;
      const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  const on = () => !muted && ac();
  function tone(f, t, d, {type="sine", vol=.3, to=null, a=.005, out=master}={}){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t+d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+a); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
    o.connect(g); g.connect(out); o.start(t); o.stop(t+d+.05);
  }
  function bell(f, t, vol=.22, d=1.1){ // glockenspiel-ish: fundamental + inharmonic partials
    tone(f, t, d, {vol}); tone(f*2.76, t, d*.45, {vol:vol*.35}); tone(f*5.4, t, d*.22, {vol:vol*.18});
  }
  let nbuf = null;
  function noise(t, d, {vol=.2, type="bandpass", f=1500, to=null, q=1}={}){
    if (!nbuf){ nbuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const ch = nbuf.getChannelData(0); for (let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1; }
    const s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();

const COLORS = ["#f2c14e","#ff7b6b","#6fd3a0","#7fb8ff","#d59bff","#ffb26b","#ff8fc7","#9be06b"];
const ICONS  = ["⭐","🎁","🦌","⛄","🔔","🍪","🧦","🎄"];
const KEY = "posada-trivia-v2";
const byId = Object.fromEntries(MOVIES.map(m => [m.id, m]));

let state = load() || fresh();
let current = null, revealed = false;

function fresh(teams){ return { started:false, used:{}, turn:0, teams: teams || [mk(0,"Team 1"), mk(1,"Team 2")] }; }
function mk(i, n){ return { n, p:0, c:i % COLORS.length }; }
function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const used = id => state.used[id] || (state.used[id] = []);
const left = m => m.qs.length - used(m.id).length;
const pts = m => m.bonus ? 2 : 1;
const team = () => state.teams[state.turn % state.teams.length];
const tag = (t, cls="who") => `<span class="${cls}" style="background:${COLORS[t.c]}">${ICONS[t.c]} ${esc(t.n)}</span>`;
const total = MOVIES.reduce((a,m)=>a+m.qs.length,0);

/* ---------- Scores ---------- */
function renderScores(bump){
  const lead = Math.max(...state.teams.map(t=>t.p));
  $("scores").innerHTML = state.teams.map((t,i)=>`
    <div class="chip ${i===state.turn%state.teams.length?"turn":""} ${bump===i?"bump":""}">
      <span class="dot" style="background:${COLORS[t.c]}">${lead>0&&t.p===lead?"👑":ICONS[t.c]}</span>${esc(t.n)}<span class="p">${t.p}</span>
    </div>`).join("");
}

/* ---------- Board ---------- */
function renderBoard(){
  const t = team();
  $("turnline").innerHTML = `${tag(t)}'s turn`;
  const usedN = total - MOVIES.reduce((a,m)=>a+left(m),0);
  $("subline").textContent = usedN === total ? "Every question has been played. Hit Finish to crown the winner!" : "Tap a movie to get a random question — or let fate decide.";
  $("prog").style.width = (usedN/total*100)+"%";
  $("surpriseBtn").disabled = usedN === total;
  $("grid").innerHTML = MOVIES.map(m => { const l = left(m); return `
    <button class="card ${m.bonus?"bonus":""}" data-id="${m.id}" ${l?"":"disabled"}>
      ${m.bonus?'<span class="x2">×2</span>':""}
      <span class="em">${l?m.emoji:"✓"}</span>
      <span class="t">${esc(m.title)}</span><span class="s">${esc(m.sub)}</span>
      <span class="n">${l?`${l} question${l>1?"s":""} left`:"All done"}</span>
    </button>`; }).join("");
  document.querySelectorAll(".card[data-id]").forEach(b => { b.onclick = () => choose(b); b.onmouseenter = () => !b.disabled && Sfx.hover(); });
  renderScores();
}

function choose(b, quiet){
  if (busy) return; busy = true;
  b.classList.add("picked"); if (!quiet) Sfx.pick();
  setTimeout(() => { busy = false; pick(byId[b.dataset.id]); }, 450);
}
let busy = false;
/* ---------- Question ---------- */
function pick(m){
  if (!m || !left(m)) return;
  const u = used(m.id);
  const pool = m.qs.map((_,i)=>i).filter(i=>!u.includes(i));
  const i = pool[Math.floor(Math.random()*pool.length)];
  current = { m, i, q:m.qs[i] }; revealed = false;
  $("qart").innerHTML = `<div class="qhead">
    <span class="pill gold">${m.emoji} ${esc(m.title)}</span>${current.q.t?`<span class="pill">${esc(current.q.t)}</span>`:""}
    <span class="pill">${esc(current.q.c)}</span>${m.bonus?`<span class="pill">⭐ Worth 2 points</span>`:""}</div>`;
  $("forwho").innerHTML = `Question for ${tag(team(),"who")}`;
  $("qtext").textContent = current.q.q; Sfx.qIn();
  $("qcard").style.animation="none"; void $("qcard").offsetWidth; $("qcard").style.animation="";
  $("answer").innerHTML = "";
  $("revealBtn").classList.remove("hidden");
  $("award").classList.add("hidden");
  $("skipBtn").textContent = "Skip this question";
  $("keys").innerHTML = `<kbd>Space</kbd> reveal · <kbd>Esc</kbd> back`;
  show("qview");
}
function reveal(){
  if (!current || revealed) return;
  revealed = true;
  $("revealBtn").classList.add("hidden");
  Sfx.drumroll(.7);
  setTimeout(() => showAnswer(), Sfx.muted ? 0 : 700);
}
function showAnswer(){
  if (!current) return;
  Sfx.reveal();
  $("answer").innerHTML = `<div class="ans">${esc(current.q.a)}</div>`;
  $("revealBtn").classList.add("hidden");
  winners = new Set();
  $("awardTeams").innerHTML = state.teams.map((t,i)=>`<button class="tbig" data-i="${i}" style="background:${COLORS[t.c]}">${ICONS[t.c]} ${esc(t.n)}<small>+${pts(current.m)} point${pts(current.m)>1?"s":""}</small></button>`).join("");
  $("awardTeams").querySelectorAll("button").forEach(b => b.onclick = () => toggle(+b.dataset.i));
  updateDone();
  $("award").classList.remove("hidden");
  $("skipBtn").textContent = "Back without scoring";
  $("keys").innerHTML = state.teams.slice(0,9).map((t,i)=>`<kbd>${i+1}</kbd> ${esc(t.n)}`).join(" · ") + ` · <kbd>Enter</kbd> score & next turn`;
}
let winners = new Set();
function toggle(i){
  if (i < 0 || i >= state.teams.length) return;
  winners.has(i) ? winners.delete(i) : winners.add(i); Sfx.toggle(winners.has(i));
  $("awardTeams").querySelectorAll("button").forEach(b => b.classList.toggle("on", winners.has(+b.dataset.i)));
  updateDone();
}
function updateDone(){
  const n = winners.size;
  $("doneBtn").textContent = n === 0 ? "Nobody got it — next turn"
    : n === state.teams.length ? "Everybody got it! Score & next turn"
    : `Give points to ${n} team${n>1?"s":""} & next turn`;
}
function award(){
  if (!current) return;
  used(current.m.id).push(current.i);
  const p = pts(current.m), list = [...winners];
  list.forEach(i => state.teams[i].p += p);
  list.length ? Sfx.score(list.length) : Sfx.nobody();
  if (list.length) {
    toast(list.length === state.teams.length ? `🎉 Everybody +${p}!` : list.map(i=>`${ICONS[state.teams[i].c]} ${state.teams[i].n}`).join("  ·  ") + `  +${p}`);
    list.forEach((i,k) => setTimeout(() => confetti(COLORS[state.teams[i].c], 110), k*180));
  }
  state.turn = (state.turn + 1) % state.teams.length;
  save(); current = null; winners = new Set(); show("board");
  renderScores(); list.forEach(i => document.querySelectorAll(".chip")[i]?.classList.add("bump"));
}
function skip(){
  Sfx.swoosh();
  // Skipping before the reveal returns the question to the pool; after the reveal it's spent.
  if (current && revealed) used(current.m.id).push(current.i);
  save(); current = null; show("board");
}
function show(v){
  $("board").classList.toggle("hidden", v!=="board");
  $("qview").classList.toggle("hidden", v!=="qview");
  document.body.classList.toggle("q-mode", v==="qview");
  if (v==="board") renderBoard();
  window.scrollTo({top:0});
}

/* ---------- Teams panel ---------- */
function openSetup(){
  $("setupLead").textContent = state.started ? "Rename teams, change colors, or fix a score" : "Name your teams, then let's play";
  $("rules").classList.toggle("hidden", state.started);
  $("startBtn").textContent = state.started ? "Back to the game" : "Let's play!";
  renderTeamRows(); $("setup").classList.remove("hidden");
}
function renderTeamRows(){
  $("teamRows").innerHTML = state.teams.map((t,i)=>`
    <div class="trow">
      <button class="sw" data-i="${i}" style="background:${COLORS[t.c]}" title="Change color">${ICONS[t.c]}</button>
      <input data-i="${i}" value="${esc(t.n)}" maxlength="22">
      ${state.started?`<div class="adj"><button data-d="-1" data-i="${i}">−</button><span>${t.p}</span><button data-d="1" data-i="${i}">+</button></div>`:""}
      ${state.teams.length>2?`<button class="rm" data-i="${i}" title="Remove">✕</button>`:""}
    </div>`).join("");
  $("teamRows").querySelectorAll("input").forEach(el => el.oninput = () => { state.teams[+el.dataset.i].n = el.value.trim() || `Team ${+el.dataset.i+1}`; save(); renderScores(); });
  $("teamRows").querySelectorAll(".sw").forEach(el => el.onclick = () => { const t = state.teams[+el.dataset.i]; t.c = (t.c+1)%COLORS.length; save(); renderTeamRows(); renderScores(); });
  $("teamRows").querySelectorAll(".rm").forEach(el => el.onclick = () => { state.teams.splice(+el.dataset.i,1); state.turn %= state.teams.length; save(); renderTeamRows(); renderScores(); });
  $("teamRows").querySelectorAll(".adj button").forEach(el => el.onclick = () => { state.teams[+el.dataset.i].p += +el.dataset.d; save(); renderTeamRows(); renderScores(); });
}
$("addTeam").onclick = () => { if (state.teams.length >= 8) return; Sfx.blip(); const i = state.teams.length; state.teams.push(mk(i, `Team ${i+1}`)); save(); renderTeamRows(); renderScores(); };
$("startBtn").onclick = () => { if (!state.started) Sfx.start(); else Sfx.swoosh(); state.started = true; save(); $("setup").classList.add("hidden"); show(current ? "qview" : "board"); };
$("teamsBtn").onclick = () => { Sfx.blip(); openSetup(); };
const muteLabel = () => { $("muteBtn").textContent = Sfx.muted ? "🔇" : "🔊"; };
$("muteBtn").onclick = () => { Sfx.setMuted(!Sfx.muted); muteLabel(); }; muteLabel();

/* ---------- Finish ---------- */
$("endBtn").onclick = () => {
  const r = [...state.teams].sort((a,b)=>b.p-a.p);
  const order = [r[1], r[0], r[2]], h = [150, 210, 110], medal = ["🥈","🥇","🥉"];
  $("podium").innerHTML = order.map((t,k)=> t ? `<div class="pod"><div class="nm">${medal[k]} ${esc(t.n)}</div>
    <div class="blk" style="height:${h[k]}px;background:${COLORS[t.c]}">${t.p}<small>points</small></div></div>` : "").join("");
  $("rest").innerHTML = r.slice(3).map((t,i)=>`${i+4}. ${esc(t.n)} — ${t.p}`).join(" · ");
  $("finish").classList.remove("hidden"); Sfx.podium();
  if (r[0] && r[0].p > 0) { confetti(COLORS[r[0].c], 260); setTimeout(()=>confetti("#f2c14e",200),400); }
};
$("keepBtn").onclick = () => $("finish").classList.add("hidden");
$("newBtn").onclick = () => {
  state = fresh(state.teams.map(t => ({...t, p:0}))); save();
  $("finish").classList.add("hidden"); current = null; show("board"); openSetup();
};


/* ---------- Wheel of Misfortune ---------- */
const WHEEL = [
  {e:"🥃", n:"Tequila / Vodka Shot", c:"#c8352e", good:true, kid:{e:"🥒", n:"Pickle Juice"}},
  {e:"🫒", n:"Olive Juice", c:"#2f7a4f"},
  {e:"🌽", n:"Corn Juice", c:"#e0a526"},
  {e:"🧅", n:"Onion Juice", c:"#8a4fb0"},
  {e:"🥚", n:"Raw Egg", c:"#d9cfb8", dark:true},
  {e:"🥄", n:"Scoop of Mayo", c:"#4a7fc0"},
  {e:"🌶️", n:"Hot Sauce Scoop", c:"#e05a1f"},
];
let wAngle = 0, wSpinning = false, wQueue = [], wPos = 0;
const wItem = i => ($("kidSafe").checked && WHEEL[i].kid) ? {...WHEEL[i], ...WHEEL[i].kid, good:false} : WHEEL[i];
function drawWheel(){
  const n = WHEEL.length, seg = 360/n, R = 112, rad = d => (d-90)*Math.PI/180;
  let h = `<circle r="118" fill="#f2c14e"/><circle r="114" fill="#13231b"/>`;
  for (let i=0;i<n;i++){
    const it = wItem(i), a0 = i*seg, a1 = a0+seg, m = a0+seg/2;
    const p = (a,r) => `${(Math.cos(rad(a))*r).toFixed(2)} ${(Math.sin(rad(a))*r).toFixed(2)}`;
    h += `<path d="M0 0 L${p(a0,R)} A${R} ${R} 0 0 1 ${p(a1,R)}Z" fill="${it.c}" stroke="#fbf3e4" stroke-width="1.5"/>`;
    const words = it.n.split(" "), mid = Math.ceil(words.length/2), lines = it.n.length > 11 ? [words.slice(0,mid).join(" "), words.slice(mid).join(" ")] : [it.n];
    const fill = it.dark ? "#1b1206" : "#fff";
    h += `<g transform="rotate(${m-90})"><text x="96" y="7" text-anchor="middle" font-size="19" transform="rotate(90 96 0)">${it.e}</text>
      ${lines.map((l,k)=>`<text x="63" y="${(k-(lines.length-1)/2)*9.5+3}" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="900" font-size="8.6" fill="${fill}">${esc(l)}</text>`).join("")}</g>`;
  }
  for (let i=0;i<n*2;i++){ const a = i*seg/2; h += `<circle cx="${(Math.cos(rad(a))*116).toFixed(1)}" cy="${(Math.sin(rad(a))*116).toFixed(1)}" r="2.6" fill="#fff8d0"/>`; }
  $("wheel").innerHTML = h;
  $("wheel").style.transform = `rotate(${wAngle}deg)`;
}
function openWheel(){
  const min = Math.min(...state.teams.map(t=>t.p));
  wQueue = state.teams.filter(t=>t.p===min); wPos = 0;
  $("finish").classList.add("hidden");
  $("wres").innerHTML = ""; drawWheel(); renderWheelQueue();
  $("wheelOv").classList.remove("hidden"); Sfx.swoosh();
}
function renderWheelQueue(){
  const t = wQueue[wPos];
  $("wheelWho").innerHTML = t ? `${wQueue.length>1?"Tied for last — everyone spins! ":"Lowest score spins! "}Up now: ${tag(t)}` : "Everyone has spun. Bottoms up! 🥴";
  $("wheelQueue").innerHTML = wQueue.length>1 ? wQueue.map((q,i)=>`<span class="${i===wPos?"now":i<wPos?"past":""}" style="background:${COLORS[q.c]}">${ICONS[q.c]} ${esc(q.n)}</span>`).join("") : "";
  $("spinBtn").disabled = !t;
}
function spinWheel(){
  if (wSpinning || !wQueue[wPos]) return;
  wSpinning = true; $("spinBtn").disabled = true; $("wres").innerHTML = "";
  const n = WHEEL.length, seg = 360/n, pick = Math.floor(Math.random()*n);
  const jitter = (Math.random()-.5)*seg*.7;
  const start = wAngle, base = start - (((start % 360)+360)%360);
  const end = base + 360*(5+Math.floor(Math.random()*3)) + (360 - (pick+.5)*seg - jitter);
  const dur = 5200 + Math.random()*1200, t0 = performance.now();
  let lastSeg = null;
  const ease = x => 1 - Math.pow(1-x, 4);
  const frame = now => {
    const x = Math.min(1, (now-t0)/dur); wAngle = start + (end-start)*ease(x);
    $("wheel").style.transform = `rotate(${wAngle}deg)`;
    const under = Math.floor(((((-wAngle) % 360)+360)%360)/seg);
    if (under !== lastSeg) { if (lastSeg !== null) { Sfx.wclick(under); const p=$("pointer"); p.classList.remove("wiggle"); void p.offsetWidth; p.classList.add("wiggle"); } lastSeg = under; }
    if (x < 1) requestAnimationFrame(frame);
    else {
      wSpinning = false;
      const it = wItem(pick), t = wQueue[wPos];
      $("wres").innerHTML = `<span>${ICONS[t.c]} ${esc(t.n)}: ${it.e} ${esc(it.n)}!</span>`;
      Sfx.wheelLand(!!it.good); confetti(it.c, 120);
      wPos++; setTimeout(renderWheelQueue, 400);
    }
  };
  requestAnimationFrame(frame);
}
$("spinBtn").onclick = spinWheel;
$("wheelClose").onclick = () => { if (wSpinning) return; $("wheelOv").classList.add("hidden"); Sfx.swoosh(); };
$("kidSafe").onchange = () => { drawWheel(); Sfx.blip(); };
$("wheelBtn").onclick = openWheel;
$("podWheel").onclick = openWheel;

/* ---------- Fun bits ---------- */
function toast(msg){ const d=document.createElement("div"); d.className="toast"; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),1900); }
const cv=$("confetti"), cx=cv.getContext("2d"); let parts=[], raf=null;
function confetti(color, n=140){
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=[color,"#f2c14e","#fbf3e4","#e04a3f","#6fd3a0"];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.6,y:-20-Math.random()*innerHeight*.3,vx:(Math.random()-.5)*6,vy:Math.random()*3+2,
    r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[i%cols.length]});
  if(!raf) tick();
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();});
  parts=parts.filter(p=>p.y<cv.height+30);
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0,0,cv.width,cv.height), null);
}

/* ---------- Controls ---------- */
$("surpriseBtn").onclick = () => {
  if (busy) return;
  const cards = [...document.querySelectorAll(".card:not(:disabled)")]; if (!cards.length) return;
  busy = true;
  const target = cards[Math.floor(Math.random()*cards.length)];
  let k = Math.floor(Math.random()*cards.length), delay = 50;
  const step = () => {
    cards.forEach(c => c.classList.remove("flash"));
    const c = cards[k++ % cards.length]; c.classList.add("flash"); Sfx.tick(k);
    if (delay > 260 && c === target) { setTimeout(() => { c.classList.remove("flash"); busy = false; Sfx.land(); choose(c, true); }, 250); return; }
    delay *= 1.12; setTimeout(step, delay);
  };
  step();
};
$("revealBtn").onclick = reveal;
$("skipBtn").onclick = skip;
$("homeBtn").onclick = () => { $("finish").classList.add("hidden"); if (current) skip(); else { Sfx.swoosh(); show("board"); } };
$("doneBtn").onclick = award;
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || !$("setup").classList.contains("hidden")) return;
  if (!$("wheelOv").classList.contains("hidden")) { if (e.code === "Space") { e.preventDefault(); spinWheel(); } else if (e.key === "Escape") $("wheelClose").onclick(); return; }
  if (!current) return;
  if (e.code === "Space") { e.preventDefault(); reveal(); }
  else if (e.key === "Escape") skip();
  else if (revealed && /^[1-9]$/.test(e.key)) toggle(+e.key - 1);
  else if (revealed && e.key === "Enter") { e.preventDefault(); award(); }
});

(function makeSnow(){
  const box = $("snow"), n = innerWidth < 700 ? 40 : 90;
  for (let i = 0; i < n; i++) {
    const f = document.createElement("i"), size = 4 + Math.random()*7;
    f.style.cssText = `left:${Math.random()*100}vw;width:${size}px;height:${size}px;opacity:${.45+Math.random()*.5};`+
      `filter:blur(${size>8?1:0}px);--sway:${(Math.random()*80-40).toFixed(0)}px;`+
      `animation-duration:${(9+Math.random()*12).toFixed(1)}s;animation-delay:-${(Math.random()*20).toFixed(1)}s`;
    box.appendChild(f);
  }
})();
renderBoard();
if (!state.started) openSetup();
</script>
</body>
</html>
