<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas Movie Trivia · Posada</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#13231b; --bg2:#1b3326; --card:#21402f; --red:#c8352e; --red2:#e04a3f;
  --gold:#f2c14e; --cream:#fbf3e4; --muted:#a9c2b2; --line:rgba(251,243,228,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at top,#1f3d2d 0%,var(--bg) 60%) fixed;
  color:var(--cream);font-family:Nunito,system-ui,sans-serif;
  display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden;
}
.snow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(2px 2px at 20% 30%,#fff8 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 70% 10%,#fff6 50%,transparent 51%),
  radial-gradient(2px 2px at 40% 80%,#fff5 50%,transparent 51%),
  radial-gradient(1px 1px at 85% 60%,#fff7 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 10% 70%,#fff5 50%,transparent 51%);
  background-size:300px 300px;animation:fall 30s linear infinite}
@keyframes fall{to{background-position:0 300px}}
header{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;
  padding:1.2rem 2rem;border-bottom:1px solid var(--line)}
h1{font-family:Fraunces,serif;font-weight:800;font-size:clamp(1.4rem,2.6vw,2.2rem);letter-spacing:.01em}
h1 span{color:var(--gold)}
.hbtn{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;
  padding:.5rem 1rem;font:700 .85rem Nunito;cursor:pointer}
.hbtn:hover{color:var(--cream);border-color:var(--muted)}
.hbtn.danger{color:#ffb3ad;border-color:#ffb3ad}
main{position:relative;z-index:1;flex:1;padding:2rem;display:flex;flex-direction:column}
.hidden{display:none!important}

/* Board */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.1rem;max-width:1500px;width:100%;margin:0 auto}
.tile{position:relative;background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);
  border-radius:20px;padding:1.4rem 1.2rem 1.1rem;overflow:hidden;cursor:pointer;text-align:left;color:inherit;font:inherit;
  transition:transform .15s,border-color .15s,box-shadow .15s;min-height:170px;display:flex;flex-direction:column}
.tile:hover:not(:disabled){transform:translateY(-4px);border-color:var(--gold);box-shadow:0 10px 30px #0006}
.tile:disabled{opacity:.3;cursor:default}
.tile .emo{font-size:2.4rem;line-height:1}
.tile .art{margin:-1.4rem -1.2rem .2rem;height:120px;border-bottom:1px solid var(--line)}
.tile .art svg{display:block;width:100%;height:100%}
.tile.random .emo{height:120px;margin:-1.4rem -1.2rem .2rem;display:flex;align-items:center;justify-content:center;font-size:4rem;background:#0002}
.tile .t{font-family:Fraunces,serif;font-weight:800;font-size:1.35rem;margin-top:.8rem;line-height:1.15}
.tile .s{color:var(--muted);font-size:.9rem;margin-top:.25rem}
.tile .left{margin-top:auto;padding-top:.8rem;font-weight:800;font-size:.85rem;color:var(--gold)}
.tile.bonus{background:linear-gradient(160deg,#4a1d1a,#2a1412);border-color:#e04a3f55}
.ribbon{position:absolute;z-index:2;top:12px;right:12px;box-shadow:0 2px 8px #0006;background:var(--gold);color:#3a2a00;font-weight:800;
  font-size:.7rem;letter-spacing:.08em;padding:.25rem .55rem;border-radius:6px}
.tile.random{background:linear-gradient(160deg,var(--red),#8f2420);border-color:transparent}
.tile.random .s{color:#ffd9d4}

/* Question */
#qview{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  max-width:1300px;margin:0 auto;width:100%}
.qmeta{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-bottom:1.6rem}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.45rem 1rem;font-weight:800;font-size:clamp(.85rem,1.3vw,1.1rem)}
.pill.gold{background:var(--gold);color:#3a2a00;border-color:transparent}
.qtext{font-family:Fraunces,serif;font-weight:600;font-size:clamp(1.8rem,4.4vw,4rem);line-height:1.2;max-width:32ch}
.answer{margin-top:2.5rem;min-height:7rem;display:flex;align-items:center;justify-content:center}
.ans{font-size:clamp(1.5rem,3.4vw,3rem);font-weight:800;color:var(--gold);
  background:#0004;border:2px dashed var(--gold);border-radius:20px;padding:1.2rem 2rem;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.actions{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:2.5rem}
.btn{border:none;border-radius:14px;padding:1rem 1.8rem;font:800 clamp(1rem,1.5vw,1.3rem) Nunito;cursor:pointer}
.btn.reveal{background:var(--red);color:#fff;box-shadow:0 6px 0 #7d1d18}
.btn.reveal:hover{background:var(--red2)}
.btn.reveal:active{transform:translateY(4px);box-shadow:0 2px 0 #7d1d18}
.btn.ghost{background:var(--card);color:var(--cream);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.hint{margin-top:1.4rem;color:var(--muted);font-size:.9rem}
kbd{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:.1rem .4rem;font-family:inherit}

/* Scores */
footer{position:relative;z-index:1;border-top:1px solid var(--line);background:#0b1611cc;backdrop-filter:blur(6px);
  padding:.8rem 1.5rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;justify-content:center}
.team{display:flex;align-items:center;gap:.5rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.4rem .5rem .4rem .9rem}
.team .name{font-weight:800;min-width:4ch;outline:none;border-bottom:1px dashed transparent}
.team .name:focus{border-bottom-color:var(--gold)}
.team .pts{font-family:Fraunces,serif;font-weight:800;font-size:1.6rem;color:var(--gold);min-width:2ch;text-align:center}
.sbtn{width:34px;height:34px;border-radius:10px;border:none;font:800 1.2rem Nunito;cursor:pointer;background:var(--bg2);color:var(--cream)}
.sbtn.plus{background:#2f7a4f}
.sbtn.x{width:24px;height:24px;font-size:.8rem;background:transparent;color:var(--muted)}
.add{background:transparent;border:1px dashed var(--muted);color:var(--muted);border-radius:14px;padding:.7rem 1rem;font:700 .9rem Nunito;cursor:pointer}
</style>
</head>
<body>
<div class="snow"></div>
<header>
  <h1>🎄 Christmas Movie <span>Trivia</span></h1>
  <button class="hbtn" id="resetBtn">Reset game</button>
</header>

<main>
  <section id="board"><div class="grid" id="grid"></div></section>

  <section id="qview" class="hidden">
    <div class="qmeta" id="qmeta"></div>
    <div class="qtext" id="qtext"></div>
    <div class="answer" id="answer"></div>
    <div class="actions">
      <button class="btn reveal" id="revealBtn">Reveal Answer</button>
      <button class="btn ghost" id="againBtn">Another from this movie</button>
      <button class="btn ghost" id="backBtn">Back to Board</button>
    </div>
    <div class="hint"><kbd>Space</kbd> reveal · <kbd>N</kbd> another · <kbd>Esc</kbd> board</div>
  </section>
</main>

<footer id="scores"></footer>

<script>

    story: svg(sky("#3d5a80","#b8c9d9") + `<g transform="translate(36 40)"><rect x="0" y="20" width="96" height="46" fill="#7a8f6a"/><path d="M-6 22 L48 -10 L102 22Z" fill="#4a3f36"/><path d="M-4 20 L48 -8 L100 20" stroke="#fff" stroke-width="4" fill="none"/>

const KEY = "posada-trivia-v1";

let state = load() || { used: {}, teams: [{n:"Team 1",p:0},{n:"Team 2",p:0}] };
let current = null, revealed = false;

function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function usedFor(id){ return state.used[id] || (state.used[id] = []); }
function remaining(m){ return m.qs.length - usedFor(m.id).length; }

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderBoard(){
  const g = $("grid"); g.innerHTML = "";
  const open = MOVIES.filter(m => remaining(m) > 0);
  const r = document.createElement("button");
  r.className = "tile random"; r.disabled = !open.length;
  r.innerHTML = `<div class="emo">🎲</div><div class="t">Random Movie</div><div class="s">Let fate pick</div><div class="left">${open.length} movies left</div>`;
  r.onclick = () => pick(open[Math.floor(Math.random()*open.length)]);
  g.appendChild(r);
  MOVIES.forEach(m => {
    const left = remaining(m);
    const b = document.createElement("button");
    b.className = "tile" + (m.bonus ? " bonus" : "");
    b.disabled = left === 0;
    b.innerHTML = `${m.bonus ? '<div class="ribbon">BONUS</div>' : ""}
      <div class="art">${ART[m.id] || ""}</div><div class="t">${esc(m.title)}</div>
      <div class="s">${esc(m.sub)}</div>
      <div class="left">${left ? left + " question" + (left>1?"s":"") + " left" : "All done ✓"}</div>`;
    b.onclick = () => pick(m);
    g.appendChild(b);
  });
}

function pick(m){
  if (!m) return;
  const used = usedFor(m.id);
  const pool = m.qs.map((_,i) => i).filter(i => !used.includes(i));
  if (!pool.length) { showBoard(); return; }
  const i = pool[Math.floor(Math.random()*pool.length)];
  used.push(i); save();
  current = { m, q: m.qs[i] }; revealed = false;
  $("qmeta").innerHTML =
    `<span class="pill gold">${m.emoji} ${esc(m.title)}</span>` +
    (current.q.t ? `<span class="pill">${esc(current.q.t)}</span>` : "") +
    `<span class="pill">${esc(current.q.c)}</span>` +
    (m.bonus ? `<span class="pill">⭐ Bonus</span>` : "");
  $("qtext").textContent = current.q.q;
  $("answer").innerHTML = "";
  $("revealBtn").classList.remove("hidden");
  $("againBtn").disabled = remaining(m) === 0;
  $("againBtn").style.opacity = remaining(m) === 0 ? .35 : 1;
  $("board").classList.add("hidden"); $("qview").classList.remove("hidden");
}

function reveal(){
  if (!current || revealed) return;
  revealed = true;
  $("answer").innerHTML = `<div class="ans">${esc(current.q.a)}</div>`;
  $("revealBtn").classList.add("hidden");
}

function showBoard(){
  current = null;
  $("qview").classList.add("hidden"); $("board").classList.remove("hidden");
  renderBoard();
}

function renderScores(){
  const f = $("scores"); f.innerHTML = "";
  state.teams.forEach((t, i) => {
    const d = document.createElement("div"); d.className = "team";
    d.innerHTML = `<span class="name" contenteditable="true" spellcheck="false">${esc(t.n)}</span>
      <button class="sbtn minus">−</button><span class="pts">${t.p}</span>
      <button class="sbtn plus">+</button><button class="sbtn x" title="Remove team">✕</button>`;
    const nm = d.querySelector(".name");
    nm.onblur = () => { state.teams[i].n = nm.textContent.trim() || `Team ${i+1}`; save(); };
    nm.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); nm.blur(); } e.stopPropagation(); };
    d.querySelector(".minus").onclick = () => { t.p--; save(); renderScores(); };
    d.querySelector(".plus").onclick  = () => { t.p++; save(); renderScores(); };
    d.querySelector(".x").onclick = () => { if (state.teams.length > 1) { state.teams.splice(i,1); save(); renderScores(); } };
    f.appendChild(d);
  });
  const a = document.createElement("button"); a.className = "add"; a.textContent = "+ Add team";
  a.onclick = () => { state.teams.push({n:`Team ${state.teams.length+1}`, p:0}); save(); renderScores(); };
  f.appendChild(a);
}

let resetArmed = null;
$("resetBtn").onclick = () => {
  const b = $("resetBtn");
  if (resetArmed) {
    clearTimeout(resetArmed); resetArmed = null;
    state = { used: {}, teams: state.teams.map(t => ({n:t.n, p:0})) };
    save(); b.textContent = "Reset game"; b.classList.remove("danger");
    renderScores(); showBoard();
  } else {
    b.textContent = "Click again to reset"; b.classList.add("danger");
    resetArmed = setTimeout(() => { resetArmed = null; b.textContent = "Reset game"; b.classList.remove("danger"); }, 3000);
  }
};
$("revealBtn").onclick = reveal;
$("againBtn").onclick = () => current && remaining(current.m) && pick(current.m);
$("backBtn").onclick = showBoard;
document.addEventListener("keydown", e => {
  if (!current) return;
  if (e.code === "Space") { e.preventDefault(); reveal(); }
  else if (e.key === "Escape") showBoard();
  else if (e.key.toLowerCase() === "n" && remaining(current.m)) pick(current.m);
});

renderBoard(); renderScores();
</script>
