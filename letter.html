function chips(key,max,{multi=true}={}){ const sel=A[key];
  return `<div class="chips" data-key="${key}" data-multi="${multi?1:0}">${OPT[key].map((o,i)=>`<button type="button" class="chip" data-i="${i}" aria-pressed="${sel.includes(i)}">${esc(o[li()])}</button>`).join("")}</div>`; }
function textQ(key,label,ph){ return `<div class="field"><label class="lbl" for="f_${key}">${esc(label)}</label><input type="text" id="f_${key}" data-bind="${key}" value="${esc(A[key])}" placeholder="${esc(ph||"")}" autocomplete="off"></div>`; }

  document.querySelectorAll(".chips[data-key]").forEach(box=>box.addEventListener("click",e=>{ const b=e.target.closest(".chip"); if(!b) return; const k=box.dataset.key, i=+b.dataset.i, multi=box.dataset.multi==="1";
    if(k==="shirt"){ A.shirt=A.shirt===optText("shirt",i)||A.shirt===OPT.shirt[i][0]?"":OPT.shirt[i][li()]; A.shirtO=""; save(); render(); return; }
    let s=A[k]; if(multi){ s=s.includes(i)?s.filter(x=>x!==i):[...s,i]; } else { s=s.includes(i)?[]:[i]; } A[k]=s; save();

      ${facts.length?`<div class="facts" style="text-align:left">${facts.map(f=>`<div class="fact"><small>${esc(f[0])}</small><b>${esc(f[1])}</b></div>`).join("")}</div>`:""}

    <p class="err" id="err" hidden></p></div>`;
  if(id==="style") h=`<div class="card in">${head("4 / 6",W.style,W.styleSub)}
    <div class="q"><h3>${esc(W.vb)}</h3>${chips("vb",0,{multi:false})}</div>
    <div class="q"><h3>${esc(W.fi)}</h3>${chips("fi",0,{multi:false})}</div>
    <div class="q"><h3>${esc(W.co)}</h3><span class="help">${esc(W.coHelp)}</span>${chips("co")}</div>

function go(s){ step=Math.max(0,Math.min(STEPS.length-1,s)); save(); render(); }

/* ---------- the sealed letter ---------- */
function build(){ const pick=k=>A[k].map(i=>optText(k,i)).join(", "), x={};
  ["vb","fi","co","sw","gc"].forEach(k=>{ const v=pick(k); if(v) x[k]=v; });
  const lvOn=A.lv.map(i=>OPT.lv[i]); if(lvOn.length) x.lv=lvOn.map(o=>o[li()]).join(", ");
  const want=new Set(lvOn.map(o=>o[2]).filter(Boolean));
  ["sc","cf"].forEach(k=>{ if(want.has(k)){ const v=pick(k); if(v) x[k]=v; } });
  ["ck","tr","rd","gm","sp","tm"].forEach(k=>{ if(want.has(k)&&A[k].trim()) x[k]=A[k].trim(); });
  ["st","no"].forEach(k=>{ if(A[k].trim()) x[k]=A[k].trim(); });
  const o={v:1,gid:inv.g.gid,n:A.name.trim(),l:lang,s:(A.shirtO.trim()||A.shirt),p:A.pants.trim(),h:A.shoe.trim(),g:A.g.map(s=>s.trim()).filter(Boolean),t:Date.now()};
  const ph=A.phone.trim(); if(ph) o.ph=ph; if(Object.keys(x).length) o.x=x; return o; }
function playCard(){ const g=inv.g, W=L(), e=(g.sb||[]).slice(0,3), medal=["🥇","🥈","🥉"];
  const url=GAME_URL+"#sb="+seal({gid:g.gid,gn:g.gn,e:g.sb||[]},"S")+"&me="+encodeURIComponent(first(A.name)||A.name);

    ${e.length?`<ol class="lb">${e.map((r,i)=>`<li><span>${medal[i]} ${esc(r[0])}</span><b>${Number(r[1]).toLocaleString()}</b></li>`).join("")}</ol>`:""}
    <a class="cta" href="${esc(url)}" target="_blank" rel="noopener">${esc(e.length?W.stayGo(String(e[0][0]).split(" ").slice(0,2).join(" ")):W.stayGo0)}</a></div>`; }
